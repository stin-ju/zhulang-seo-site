<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI分析 - 竞足·竞篮 | AI实验室·体彩好伙伴</title>
    <meta name="description" content="AI智能分析入口，选择竞足或竞篮查看AI预测分析。">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background: #0b0b14;
            color: #e5e7eb;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }

        /* 导航 */
        .navbar {
            background: rgba(11, 11, 20, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .logo { font-size: 18px; font-weight: 800; color: #8b5cf6; text-decoration: none; }
        .logo span { color: #fff; }
        .nav-links { display: flex; gap: 2px; flex-wrap: wrap; }
        .nav-links a {
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #9ca3af;
            text-decoration: none;
            transition: all 0.2s;
        }
        .nav-links a:hover { color: #e5e7eb; background: rgba(255, 255, 255, 0.04); }
        .nav-links a.active { color: #a78bfa; background: rgba(139, 92, 246, 0.12); }

        /* 主内容 */
        .hero {
            text-align: center;
            padding: 60px 0 40px;
        }
        .hero h1 {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 12px;
        }
        .hero h1 .accent {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p {
            color: #6b7280;
            font-size: 16px;
        }

        /* 按钮区 */
        .sport-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin: 40px 0 60px;
        }
        @media (max-width: 600px) {
            .sport-grid { grid-template-columns: 1fr; gap: 16px; }
            .hero h1 { font-size: 28px; }
        }

        .sport-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #14141f;
            border: 2px solid #2a2a3e;
            border-radius: 20px;
            padding: 50px 30px;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer;
        }
        .sport-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .sport-card.football:hover {
            border-color: #22c55e;
            box-shadow: 0 20px 40px rgba(34, 197, 94, 0.15);
        }
        .sport-card.basketball:hover {
            border-color: #f97316;
            box-shadow: 0 20px 40px rgba(249, 115, 22, 0.15);
        }

        .sport-icon {
            font-size: 72px;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .sport-card:hover .sport-icon {
            transform: scale(1.15);
        }

        .sport-name {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .sport-card.football .sport-name { color: #22c55e; }
        .sport-card.basketball .sport-name { color: #f97316; }

        .sport-desc {
            font-size: 14px;
            color: #6b7280;
            text-align: center;
        }

        .sport-arrow {
            margin-top: 20px;
            font-size: 20px;
            color: #6b7280;
            transition: all 0.3s;
        }
        .sport-card:hover .sport-arrow {
            transform: translateX(8px);
        }
        .sport-card.football:hover .sport-arrow { color: #22c55e; }
        .sport-card.basketball:hover .sport-arrow { color: #f97316; }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a href="/" class="logo">AI实验室<span> · </span>体彩好伙伴</a>
        <div class="nav-links">
            <a href="/ai-hub.html" class="active">AI分析</a>
            <a href="/basketball.html">篮球</a>
            <a href="/">🏠 首页</a>
        </div>
    </div>
</nav>

<main class="container">
    <section class="hero">
        <h1>AI <span class="accent">智能分析</span></h1>
        <p>选择赛事类型，查看AI预测分析</p>
    </section>

    <div class="sport-grid">
        <a href="/ai-analysis.html" class="sport-card football">
            <div class="sport-icon">⚽</div>
            <div class="sport-name">竞足</div>
            <div class="sport-desc">世界杯 · 五大联赛<br>7位AI逐场分析</div>
            <div class="sport-arrow">→</div>
        </a>
        <a href="/basketball.html" class="sport-card basketball">
            <div class="sport-icon">🏀</div>
            <div class="sport-name">竞篮</div>
            <div class="sport-desc">WNBA · NBA<br>AI智能预测</div>
            <div class="sport-arrow">→</div>
        </a>
    </div>
</main>

<footer class="footer">
    <p>AI实验室 · 体彩好伙伴 · 数据仅供研究参考 · 不构成任何投注建议</p>
</footer>

</body>
</html>
