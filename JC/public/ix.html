<!DOCTYPE html><html lang="zh-CN"><head><!-- Coze Coding Analytics -->
<script>
(function(){
  function randomUUID(){
    if(typeof crypto!=="undefined"&&typeof crypto.randomUUID==="function"){
      return crypto.randomUUID();
    }
    return "10000000-1000-4000-8000-100000000000".replace(/[018]/g,function(c){
      return(+c^(crypto.getRandomValues(new Uint8Array(1))[0]&(15>>(+c/4)))).toString(16);
    });
  }

  function encode(obj){return btoa(JSON.stringify(obj))}
  function decode(str){try{return JSON.parse(atob(str))}catch(e){return null}}

  function getDeviceId(){
    var storageKey="__coze_coding_device_info";
    try{
      var info=decode(localStorage.getItem(storageKey));
      if(info&&typeof info.did==="string"){return info.did}
    }catch(e){}
    var newInfo={did:randomUUID()};
    try{localStorage.setItem(storageKey,encode(newInfo))}catch(e){}
    return newInfo.did;
  }

  function sendPageViewEvent(){
    var deviceId=getDeviceId();
    var projectId="7652750153115320372";
    var reportURL="https://code.coze.cn/api/coding/deployment/analytics/report?project_id="+encodeURIComponent(projectId)+"&did="+encodeURIComponent(deviceId);
    try{
      fetch(reportURL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          events:[{
            type:"page_view",
            url:window.location.href,
            path:window.location.pathname,
            referrer:document.referrer,
            timestamp:Date.now()
          }]
        })
      }).catch(function(){});
    }catch(e){}
  }

  if(document.readyState==="complete"){
    sendPageViewEvent();
  }else{
    document.addEventListener("readystatechange",function(){
      if(document.readyState==="complete"){sendPageViewEvent()}
    });
  }
})();
</script>

<style>
/* 让球列 - 桌面端固定宽度 */
.handicap-col { width: 160px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }

@media screen and (max-width: 420px) {
    .container { padding: 0 8px; }
    .hero h1 { font-size: 18px; }
    .hero-stats { gap: 10px; }
    .hero-stat { font-size: 12px; }
    .hero-stat .num { font-size: 18px; }
    .date-tabs { flex-wrap: wrap; gap: 3px; }
    .date-tab { font-size: 11px; padding: 4px 8px; }

    /* 比赛卡片：手机端改为多行布局，徽章独占一行 */
    .view-item {
        flex-wrap: wrap;
        padding: 8px 10px;
        gap: 4px 6px;
        font-size: 12px;
        align-items: center;
    }
    .view-item .time {
        font-size: 11px;
        width: auto;
        flex-shrink: 0;
        order: 1;
    }
    .view-item .match-teams,
    .view-item .teams {
        font-size: 13px;
        word-break: break-all;
        white-space: normal;
    }
    /* 队名容器：占据剩余宽度，不截断 */
    .view-item > div[style*="flex:1"] {
        order: 2;
        flex: 1 1 auto !important;
        min-width: 0;
    }
    /* 让球列手机端隐藏，节省空间 */
    .handicap-col {
        display: none;
    }
    /* 徽章组：独占一行，右对齐 */
    .view-item .badge-group {
        order: 3;
        width: 100%;
        display: flex;
        justify-content: flex-end;
        gap: 4px;
        flex-shrink: 1;
        flex-wrap: wrap;
        margin-top: 2px;
    }
    .badge-sm {
        font-size: 10px;
        padding: 1px 6px;
        flex-shrink: 0;
    }
    /* 编号标签 */
    .match-lottery-id {
        order: 0;
        flex-shrink: 0;
    }
    /* 箭头 */
    .arrow-sm {
        order: 4;
    }
    .view-item .score { font-size: 14px; }
    .pred-table { font-size: 10px; }
    .pred-table th, .pred-table td { padding: 3px 2px; }
    .pred-table .ai-col { min-width: 45px; font-size: 10px; }
    .rank-card { padding: 10px 12px; }
    .rank-row { font-size: 11px; gap: 6px; }
    .brief-text { font-size: 12px; line-height: 1.6; }
