        /* 比分三排布局 */

        .score-row .odds-btn .label { color:#6b7280; font-weight:500; }

                <button id="clearAllBtn">清空</button>
            </div>
            <div id="betList"><div class="panel-empty">点击赔率添加</div></div>
            <div class="panel-pass-section" id="passSection" style="display:none;">
                <div class="label">过关方式</div>
                <div class="panel-pass-grid" id="passGrid"></div>
                <div class="pass-hint" id="passHint" style="font-size:11px;color:#6b7280;margin-top:4px;"></div>
            </div>
        </div>
    </div>
    <!-- 底部浮动选单栏 -->
    <div class="bottom-bet-slip">
        <div class="slip-container">
            <!-- 左侧：选单按钮 -->
            <div class="slip-left-btn">
                <button class="dan-btn" id="danBtn">
                    <span>已选</span>
                    <span class="count" id="selCount">0</span>
                    <span>场</span>
                    <span class="arrow">▲</span>
                </button>
            </div>
            <!-- 中间：过关方式 + 倍数 -->
            <div class="slip-middle">
                <div class="pass-type-section">
                    <span class="label">过关方式：</span>
                    <div class="pass-type-options">
                        <button class="active" data-type="mn">M串N</button>
                        <button data-type="free">自由过关</button>
                    </div>
                </div>
                <div class="multiplier-section">
                    <span class="label">倍数：</span>
                    <div class="multiplier-control">
                        <button id="multMinus">−</button>
                        <input type="number" id="multiplierInput" value="1" min="1" max="50" />
                        <button id="multPlus">+</button>
                    </div>
                    <span class="multiplier-hint">[最高50倍]</span>
                </div>
            </div>
            <!-- 右侧：金额 + 奖金 -->
            <div class="slip-right-info">
                <div class="amount-display">
                    <div class="bet-amount">投注金额：<strong id="betAmount">0</strong>元</div>
                    <div class="bonus-amount">理论最高奖金：<strong id="bonusAmount">0.00</strong>元</div>
                </div>
                <button class="detail-btn" id="detailBtn">奖金详情</button>
            </div>
        </div>
    </div>
    <!-- 奖金详情弹窗 -->
    <div id="detailModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:center;">
        <div style="background:#1a1a2e;border-radius:12px;padding:20px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #2d2d44;">
                <h4 style="color:#e5e7eb;font-size:16px;">奖金详情</h4>
                <button id="closeDetail" style="background:none;border:none;color:#9ca3af;font-size:20px;cursor:pointer;">×</button>
            </div>
            <div id="detailContent"></div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid #2d2d44;">
                <div style="display:flex;justify-content:space-between;color:#9ca3af;font-size:13px;">
                    <span>注数：<span id="betCount" style="color:#fff;">0</span></span>
                    <span id="amountBreakdown">每注 2 元 × 0 注 × 1 倍</span>
                </div>
                <div style="text-align:right;margin-top:8px;">
                    <span style="color:#9ca3af;font-size:12px;">提示：</span>
                    <span id="calcHint" style="color:#6b7280;font-size:12px;">请选择至少 2 场比赛</span>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./calculator.202607141631.js"></script>
