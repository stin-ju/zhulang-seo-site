<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI实验室 · 奖金计算器</title>
    <meta name="description" content="竞彩足球奖金计算器，支持胜平负、让球、比分、总进球、半全场5种玩法，混合过关，串关计算。">
    <meta name="keywords" content="竞彩足球,奖金计算器,串关计算,混合过关,世界杯预测">
    <link rel="canonical" href="https://zhulang.coze.site/calculator.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: #0b0b14; color: #e5e7eb; min-height: 100vh; padding-bottom: 120px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

        /* 导航 */
        .navbar { background: rgba(11, 11, 20, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.04); padding: 10px 0; position: sticky; top: 0; z-index: 100; }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .logo { font-size: 18px; font-weight: 800; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo .icon { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; background: linear-gradient(135deg, #8b5cf6, #6d28d9); border-radius: 8px; font-size: 14px; color: #fff; }
        .logo .name { color: #e5e7eb; }
        .logo .name .accent { color: #8b5cf6; }
        .nav-links { display: flex; gap: 2px; flex-wrap: wrap; }
        .nav-links a { padding: 5px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; color: #9ca3af; text-decoration: none; transition: all 0.2s; }
        .nav-links a:hover { color: #e5e7eb; background: rgba(255,255,255,0.04); }
        .nav-links a.active { color: #a78bfa; background: rgba(139,92,246,0.12); }
        .nav-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.06); margin: 0 2px; }

        /* 运动切换 */
        .sport-switch { display: flex; gap: 0; background: #1a1a2a; border-radius: 8px; padding: 3px; margin: 12px 0; width: fit-content; }
        .sport-switch button { padding: 8px 24px; border-radius: 6px; border: none; background: transparent; color: #9ca3af; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .sport-switch button.active { background: #8b5cf6; color: #fff; }

        /* 玩法Tab */
        .bet-tabs { display: flex; gap: 0; background: #0f0f1a; border-radius: 10px; padding: 3px; margin-bottom: 12px; border: 1px solid #1e1e30; flex-wrap: wrap; }
        .bet-tabs .tab { flex: 1; min-width: 80px; text-align: center; padding: 8px 8px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #6b7280; cursor: pointer; transition: all 0.2s; border: none; background: transparent; white-space: nowrap; }
        .bet-tabs .tab:hover { color: #9ca3af; }
        .bet-tabs .tab.active { background: #8b5cf6; color: #fff; box-shadow: 0 2px 8px rgba(139,92,246,0.3); }

        /* 比赛卡片 */
        .match-card { background: #14141f; border: 1px solid #2a2a3e; border-radius: 10px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s; }
        .match-card:hover { border-color: #3a3a5e; }
        .match-card.banker { border-color: #f59e0b; background: rgba(245,158,11,0.03); }
        .match-card.banker::before { content: '胆'; position: absolute; top: 0; left: 0; background: #f59e0b; color: #000; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 0 0 6px 0; }
        .match-card { position: relative; }
        .match-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #1a1a2a; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; }
        .match-header .match-id { color: #6b7280; font-weight: 600; min-width: 60px; }
        .match-header .match-time { color: #9ca3af; min-width: 42px; }
        .match-header .match-teams { font-weight: 600; font-size: 14px; flex: 1; }
        .match-header .match-teams .vs { color: #6b7280; font-weight: 400; font-size: 12px; margin: 0 4px; }
        .match-header .handicap-tag { background: rgba(251,191,36,0.15); color: #fbbf24; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .match-header .banker-btn { background: transparent; border: 1px solid #3a3a5e; color: #6b7280; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: all 0.2s; }
        .match-header .banker-btn:hover { border-color: #f59e0b; color: #f59e0b; }
        .match-header .banker-btn.active { background: #f59e0b; color: #000; border-color: #f59e0b; }

        /* 胜平负 / 让球胜平负 选项 */
        .odds-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
        .odds-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 8px; cursor: pointer; transition: all 0.15s; border-right: 1px solid rgba(255,255,255,0.04); position: relative; }
        .odds-btn:last-child { border-right: none; }
        .odds-btn:hover { background: rgba(139,92,246,0.08); }
        .odds-btn.selected { background: rgba(139,92,246,0.2); }
        .odds-btn.selected::after { content: '✓'; position: absolute; top: 4px; right: 6px; font-size: 10px; color: #8b5cf6; }
        .odds-btn .opt-label { font-size: 11px; color: #6b7280; margin-bottom: 4px; }
        .odds-btn .opt-odds { font-size: 16px; font-weight: 700; }
        .odds-btn.win .opt-odds { color: #22c55e; }
        .odds-btn.draw .opt-odds { color: #fbbf24; }
        .odds-btn.lose .opt-odds { color: #ef4444; }

        /* 比分网格 */
        .score-grid { padding: 8px 10px; }
        .score-group { margin-bottom: 8px; }
        .score-group-title { font-size: 11px; color: #6b7280; font-weight: 600; margin-bottom: 4px; padding-left: 2px; }
        .score-options { display: flex; flex-wrap: wrap; gap: 4px; }
        .score-btn { padding: 6px 8px; border-radius: 6px; background: #1a1a2a; border: 1px solid #2a2a3e; font-size: 12px; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 52px; }
        .score-btn:hover { border-color: #8b5cf6; background: rgba(139,92,246,0.08); }
        .score-btn.selected { border-color: #8b5cf6; background: rgba(139,92,246,0.2); }
        .score-btn .score-label { font-weight: 600; color: #e5e7eb; font-size: 12px; }
        .score-btn .score-odds { color: #9ca3af; font-size: 10px; }

        /* 总进球 */
        .goals-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 10px 12px; }
        .goals-btn { padding: 10px 6px; border-radius: 8px; background: #1a1a2a; border: 1px solid #2a2a3e; text-align: center; cursor: pointer; transition: all 0.15s; }
        .goals-btn:hover { border-color: #8b5cf6; background: rgba(139,92,246,0.08); }
        .goals-btn.selected { border-color: #8b5cf6; background: rgba(139,92,246,0.2); }
        .goals-btn .goals-label { font-size: 13px; font-weight: 600; color: #e5e7eb; }
        .goals-btn .goals-odds { font-size: 12px; color: #9ca3af; margin-top: 2px; }

        /* 半全场 */
        .h2h-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 12px; }
        .h2h-btn { padding: 10px 6px; border-radius: 8px; background: #1a1a2a; border: 1px solid #2a2a3e; text-align: center; cursor: pointer; transition: all 0.15s; }
        .h2h-btn:hover { border-color: #8b5cf6; background: rgba(139,92,246,0.08); }
        .h2h-btn.selected { border-color: #8b5cf6; background: rgba(139,92,246,0.2); }
        .h2h-btn .h2h-label { font-size: 13px; font-weight: 600; color: #e5e7eb; }
        .h2h-btn .h2h-odds { font-size: 12px; color: #9ca3af; margin-top: 2px; }

        /* 底部固定计算栏 */
        .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2a; border-top: 1px solid #2a2a3e; padding: 12px 16px; z-index: 99; box-shadow: 0 -4px 20px rgba(0,0,0,0.3); }
        .bottom-bar .container { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .bar-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .bar-right { display: flex; align-items: center; gap: 16px; }
        .selected-count-btn { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; padding: 8px 16px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .selected-count-btn .count { font-size: 18px; }
        .pass-mode-switch { display: flex; gap: 0; background: #0f0f1a; border-radius: 6px; padding: 2px; }
        .pass-mode-switch button { padding: 6px 12px; border-radius: 4px; border: none; background: transparent; color: #6b7280; font-size: 12px; font-weight: 500; cursor: pointer; }
        .pass-mode-switch button.active { background: #8b5cf6; color: #fff; }
        .multiplier-box { display: flex; align-items: center; gap: 0; }
        .multiplier-box button { width: 28px; height: 28px; border: 1px solid #3a3a5e; background: #14141f; color: #9ca3af; font-size: 16px; cursor: pointer; }
        .multiplier-box button:first-child { border-radius: 4px 0 0 4px; }
        .multiplier-box button:last-child { border-radius: 0 4px 4px 0; }
        .multiplier-box input { width: 40px; height: 28px; border: 1px solid #3a3a5e; border-left: none; border-right: none; background: #0f0f1a; color: #fff; text-align: center; font-size: 14px; font-weight: 600; }
        .bar-info { font-size: 13px; color: #9ca3af; }
        .bar-info .amount { color: #f59e0b; font-weight: 700; }
        .bar-info .prize { color: #22c55e; font-weight: 700; }
        .bar-detail-btn { background: #f59e0b; color: #000; padding: 8px 16px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }

        /* 过关方式选择面板 */
        .pass-panel { display: none; position: fixed; bottom: 70px; left: 0; right: 0; background: #14141f; border-top: 1px solid #2a2a3e; padding: 16px; z-index: 98; max-height: 50vh; overflow-y: auto; }
        .pass-panel.show { display: block; }
        .pass-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #e5e7eb; }
        .pass-options { display: flex; flex-wrap: wrap; gap: 8px; }
        .pass-options button { padding: 8px 14px; border-radius: 6px; border: 1px solid #2a2a3e; background: #1a1a2a; color: #9ca3af; font-size: 13px; cursor: pointer; transition: all 0.15s; }
        .pass-options button:hover { border-color: #8b5cf6; }
        .pass-options button.active { border-color: #8b5cf6; background: rgba(139,92,246,0.15); color: #a78bfa; }

        /* 已选比赛弹窗 */
        .selected-panel { display: none; position: fixed; bottom: 70px; left: 0; right: 0; background: #14141f; border-top: 1px solid #2a2a3e; padding: 16px; z-index: 98; max-height: 60vh; overflow-y: auto; }
        .selected-panel.show { display: block; }
        .selected-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .selected-panel h3 button { background: none; border: none; color: #6b7280; font-size: 12px; cursor: pointer; }
        .sel-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: #1a1a2a; border-radius: 8px; margin-bottom: 8px; }
        .sel-item .sel-info { flex: 1; }
        .sel-item .sel-match { font-size: 13px; font-weight: 600; }
        .sel-item .sel-pick { font-size: 12px; color: #8b5cf6; margin-top: 2px; }
        .sel-item .sel-banker { font-size: 10px; background: #f59e0b; color: #000; padding: 1px 4px; border-radius: 3px; margin-left: 6px; }
        .sel-item .sel-remove { background: none; border: none; color: #6b7280; font-size: 18px; cursor: pointer; padding: 4px 8px; }
        .sel-item .sel-remove:hover { color: #ef4444; }

        .empty-state { text-align: center; padding: 40px 20px; color: #6b7280; }
        .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
        .empty-state .title { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #9ca3af; }

        @media (max-width: 768px) {
            .bet-tabs .tab { font-size: 11px; padding: 7px 4px; min-width: 60px; }
            .odds-btn .opt-odds { font-size: 14px; }
            .bottom-bar .container { flex-direction: column; align-items: stretch; }
            .bar-left, .bar-right { justify-content: center; }
            .score-btn { min-width: 46px; padding: 5px 6px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">
                <span class="icon">🧪</span>
                <span class="name">AI实验室 <span class="accent">·</span> <span class="accent">体彩</span>好伙伴</span>
            </a>
            <div class="nav-links">
                <a href="/">首页</a>
                <a href="/football.html">足球</a>
                <a href="/basketball.html">篮球</a>
                <a href="/calculator.html" class="active">计算器</a>
                <span class="nav-divider"></span>
                <a href="/rank.html">排行</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- 运动切换 -->
        <div class="sport-switch">
            <button class="active" onclick="switchSport('football')">⚽ 足球</button>
            <button onclick="switchSport('basketball')">🏀 篮球</button>
        </div>

        <!-- 玩法Tab -->
        <div class="bet-tabs" id="betTabs"></div>

        <!-- 比赛列表 -->
        <div id="matchList"></div>
    </main>

    <!-- 已选比赛面板 -->
    <div class="selected-panel" id="selectedPanel">
        <h3>
            <span>已选比赛 (<span id="selectedCountPanel">0</span>)</span>
            <button onclick="closeAllPanels()">关闭</button>
        </h3>
        <div id="selectedListPanel"></div>
    </div>

    <!-- 过关方式面板 -->
    <div class="pass-panel" id="passPanel">
        <h3>选择过关方式</h3>
        <div class="pass-options" id="passOptions"></div>
    </div>

    <!-- 底部固定计算栏 -->
    <div class="bottom-bar">
        <div class="container">
            <div class="bar-left">
                <button class="selected-count-btn" onclick="toggleSelectedPanel()">
                    <span>已选</span>
                    <span class="count" id="selectedCount">0</span>
                    <span>场</span>
                </button>
                <div class="pass-mode-switch">
                    <button class="active" onclick="setPassMode('normal')">M串N</button>
                    <button onclick="setPassMode('free')">自由过关</button>
                </div>
            </div>
            <div class="bar-right">
                <div class="multiplier-box">
                    <button onclick="changeMultiplier(-1)">−</button>
                    <input type="number" id="multiplier" value="1" min="1" max="50" onchange="updateCalc()">
                    <button onclick="changeMultiplier(1)">+</button>
                </div>
                <div class="bar-info">
                    投注: <span class="amount" id="totalAmount">0</span>元
                </div>
                <div class="bar-info">
                    最高奖金: <span class="prize" id="maxPrize">0.00</span>元
                </div>
                <button class="bar-detail-btn" onclick="showPassPanel()">过关方式</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 嵌入数据 ==========
        window.MATCH_DATA = [{"id":"周一076","teams":"荷兰VS摩洛哥","match_time":"2026-06-30 09:00:00","handicap":"-1","status":"待比赛","win_odds":1.89,"draw_odds":3.07,"lose_odds":3.64,"handicap_win_odds":3.82,"handicap_draw_odds":3.58,"handicap_lose_odds":1.7,"home_team":"荷兰","away_team":"摩洛哥","match_date":"2026-06-30"}];

        // ========== 状态 ==========
        let currentSport = 'football';
        let currentBetType = 'spf';
        let selectedMatches = []; // {matchId, matchName, pickType, pickLabel, odds, isBanker, key}
        let passMode = 'normal'; // 'normal' or 'free'
        let selectedPass = '3串1';
        let multiplier = 1;

        // ========== 玩法配置 ==========
        const FOOTBALL_BET_TYPES = {
            'spf': { name: '胜平负', options: ['胜','平','负'] },
            'rqspf': { name: '让球胜平负', options: ['让胜','让平','让负'] },
            'bf': { name: '比分', options: [] },
            'zjq': { name: '总进球', options: [] },
            'bqc': { name: '半全场', options: [] }
        };

        const BASKETBALL_BET_TYPES = {
            'spf': { name: '胜负', options: ['胜','负'] },
            'rqspf': { name: '让分胜负', options: ['让胜','让负'] },
            'dx': { name: '大小分', options: ['大','小'] },
            'sfc': { name: '胜分差', options: [] }
        };

        // ========== 比分赔率表 ==========
        const SCORE_ODDS = {
            '1:0':6.5,'2:0':7.0,'2:1':7.5,'3:0':9.0,'3:1':10.0,'3:2':13.0,
            '4:0':15.0,'4:1':18.0,'4:2':23.0,'5:0':30.0,'5:1':40.0,'5:2':50.0,
            '0:0':8.0,'1:1':6.0,'2:2':10.0,'3:3':25.0,
            '0:1':8.5,'0:2':11.0,'1:2':9.0,'0:3':15.0,'1:3':17.0,'2:3':23.0,
            '0:4':28.0,'1:4':35.0,'2:4':45.0,'0:5':50.0,'1:5':65.0,'2:5':80.0,
            '胜其他':20.0,'平其他':25.0,'负其他':40.0
        };
        const SCORE_GROUPS = [
            { title: '主胜', scores: ['1:0','2:0','2:1','3:0','3:1','3:2','4:0','4:1','4:2','5:0','5:1','5:2','胜其他'] },
            { title: '平局', scores: ['0:0','1:1','2:2','3:3','平其他'] },
            { title: '主负', scores: ['0:1','0:2','1:2','0:3','1:3','2:3','0:4','1:4','2:4','0:5','1:5','2:5','负其他'] }
        ];

        const GOALS_ODDS = [
            {label:'0球',odds:8.0},{label:'1球',odds:4.5},{label:'2球',odds:3.2},{label:'3球',odds:3.0},
            {label:'4球',odds:4.0},{label:'5球',odds:6.5},{label:'6球',odds:11.0},{label:'7+球',odds:20.0}
        ];

        const H2H_ODDS = [
            {label:'胜胜',odds:2.8},{label:'胜平',odds:13.0},{label:'胜负',odds:25.0},
            {label:'平胜',odds:6.5},{label:'平平',odds:5.5},{label:'平负',odds:8.0},
            {label:'负胜',odds:15.0},{label:'负平',odds:10.0},{label:'负负',odds:4.2}
        ];

        // ========== 工具函数 ==========
        function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
        function fmtTime(dt) { try { return dt.slice(11,16); } catch(e) { return ''; } }
        function fmtDate(dt) { try { const d=new Date(dt); const wd=['周日','周一','周二','周三','周四','周五','周六']; return wd[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate(); } catch(e) { return dt?.slice(5,10)||''; } }

        // ========== 运动切换 ==========
        function switchSport(sport) {
            currentSport = sport;
            document.querySelectorAll('.sport-switch button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderBetTabs();
            renderMatches();
        }

        // ========== 渲染玩法Tab ==========
        function renderBetTabs() {
            const tabs = document.getElementById('betTabs');
            const types = currentSport === 'football' ? FOOTBALL_BET_TYPES : BASKETBALL_BET_TYPES;
            currentBetType = Object.keys(types)[0];
            let html = '';
            Object.keys(types).forEach(key => {
                html += `<button class="tab ${key===currentBetType?'active':''}" onclick="switchBetType('${key}')">${types[key].name}</button>`;
            });
            tabs.innerHTML = html;
        }

        function switchBetType(type) {
            currentBetType = type;
            document.querySelectorAll('.bet-tabs .tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderMatches();
        }

        // ========== 渲染比赛列表 ==========
        function renderMatches() {
            const allMatches = window.MATCH_DATA || [];
            const matches = allMatches.filter(m => m.status === '待比赛');
            const container = document.getElementById('matchList');

            if (matches.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="title">暂无待比赛赛事</div><div>当前没有可投注的${currentSport==='football'?'足球':'篮球'}比赛</div></div>`;
                return;
            }

            const groups = {};
            matches.forEach(m => {
                const dk = m.match_date || m.match_time?.slice(0,10) || 'unknown';
                if (!groups[dk]) groups[dk] = [];
                groups[dk].push(m);
            });
            const sortedDates = Object.keys(groups).sort();
            const today = new Date().toISOString().slice(0,10);

            let html = '';
            sortedDates.forEach(dk => {
                const dayMatches = groups[dk];
                const isToday = dk === today;
                html += '<div style="margin-bottom:12px;">';
                html += '<div style="font-size:13px;font-weight:600;color:#9ca3af;padding:6px 4px;display:flex;align-items:center;gap:8px;">';
                html += '<span>' + fmtDate(dk) + '</span>';
                html += '<span style="font-size:11px;color:#6b7280;">' + dayMatches.length + '场</span>';
                if (isToday) html += '<span style="font-size:10px;color:#22c55e;background:rgba(34,197,94,0.12);padding:1px 6px;border-radius:3px;">今日</span>';
                html += '</div>';

                dayMatches.forEach(m => {
                    html += renderMatchCard(m);
                });
                html += '</div>';
            });

            container.innerHTML = html;
        }

        function renderMatchCard(m) {
            const home = m.home_team || '主队';
            const away = m.away_team || '客队';
            const id = m.id || '---';
            const time = fmtTime(m.match_time);
            const handicap = m.handicap || '0';
            const isBanker = selectedMatches.some(s => s.matchId === id && s.isBanker);

            let html = `<div class="match-card ${isBanker?'banker':''}" data-match-id="${id}">`;
            html += '<div class="match-header">';
            html += `<span class="match-id">${esc(id)}</span>`;
            html += `<span class="match-time">${time}</span>`;
            html += `<span class="match-teams">${esc(home)}<span class="vs">VS</span>${esc(away)}</span>`;
            if (currentBetType === 'rqspf') {
                html += `<span class="handicap-tag">让${handicap.replace('+','')}</span>`;
            }
            html += `<button class="banker-btn ${isBanker?'active':''}" onclick="toggleBanker('${id}','${esc(home)} VS ${esc(away)}')">设胆</button>`;
            html += '</div>';

            if (currentSport === 'football') {
                if (currentBetType === 'spf') {
                    html += renderSPF(m, 'win_odds', 'draw_odds', 'lose_odds', ['胜','平','负']);
                } else if (currentBetType === 'rqspf') {
                    html += renderSPF(m, 'handicap_win_odds', 'handicap_draw_odds', 'handicap_lose_odds', ['让胜','让平','让负']);
                } else if (currentBetType === 'bf') {
                    html += renderScore(m);
                } else if (currentBetType === 'zjq') {
                    html += renderGoals(m);
                } else if (currentBetType === 'bqc') {
                    html += renderH2H(m);
                }
            } else {
                // 篮球玩法
                if (currentBetType === 'spf') {
                    html += renderBasketballSPF(m);
                } else if (currentBetType === 'rqspf') {
                    html += renderBasketballHandicap(m);
                } else {
                    html += '<div style="padding:20px;text-align:center;color:#6b7280;">篮球其他玩法开发中...</div>';
                }
            }

            html += '</div>';
            return html;
        }

        // ========== 足球玩法渲染 ==========
        function renderSPF(m, wk, dk, lk, labels) {
            const w = m[wk] || '--';
            const d = m[dk] || '--';
            const l = m[lk] || '--';
            const cls = ['win', 'draw', 'lose'];
            const vals = [w, d, l];
            let html = '<div class="odds-row">';
            labels.forEach((label, i) => {
                const key = m.id + '_' + currentBetType + '_' + label;
                const isSel = selectedMatches.some(s => s.key === key);
                html += `<div class="odds-btn ${cls[i]} ${isSel?'selected':''}" onclick="pickSPF('${m.id}','${esc(m.home_team||'')} VS ${esc(m.away_team||'')}','${label}',${vals[i]},'${currentBetType}')">`;
                html += `<span class="opt-label">${label}</span>`;
                html += `<span class="opt-odds">${vals[i]}</span>`;
                html += '</div>';
            });
            html += '</div>';
            return html;
        }

        function renderScore(m) {
            let html = '<div class="score-grid">';
            SCORE_GROUPS.forEach(g => {
                html += '<div class="score-group">';
                html += `<div class="score-group-title">${g.title}</div>`;
                html += '<div class="score-options">';
                g.scores.forEach(sc => {
                    const odds = SCORE_ODDS[sc] || '--';
                    const key = m.id + '_bf_' + sc;
                    const isSel = selectedMatches.some(s => s.key === key);
                    html += `<div class="score-btn ${isSel?'selected':''}" onclick="pickOption('${m.id}','${esc(m.home_team||'')} VS ${esc(m.away_team||'')}','比分 ${sc}',${odds},'bf')">`;
                    html += `<span class="score-label">${sc}</span>`;
                    html += `<span class="score-odds">${odds}</span>`;
                    html += '</div>';
                });
                html += '</div></div>';
            });
            html += '</div>';
            return html;
        }

        function renderGoals(m) {
            let html = '<div class="goals-grid">';
            GOALS_ODDS.forEach(g => {
                const key = m.id + '_zjq_' + g.label;
                const isSel = selectedMatches.some(s => s.key === key);
                html += `<div class="goals-btn ${isSel?'selected':''}" onclick="pickOption('${m.id}','${esc(m.home_team||'')} VS ${esc(m.away_team||'')}','总进球 ${g.label}',${g.odds},'zjq')">`;
                html += `<div class="goals-label">${g.label}</div>`;
                html += `<div class="goals-odds">${g.odds}</div>`;
                html += '</div>';
            });
            html += '</div>';
            return html;
        }

        function renderH2H(m) {
            let html = '<div class="h2h-grid">';
            H2H_ODDS.forEach(h => {
                const key = m.id + '_bqc_' + h.label;
                const isSel = selectedMatches.some(s => s.key === key);
                html += `<div class="h2h-btn ${isSel?'selected':''}" onclick="pickOption('${m.id}','${esc(m.home_team||'')} VS ${esc(m.away_team||'')}','半全场 ${h.label}',${h.odds},'bqc')">`;
                html += `<div class="h2h-label">${h.label}</div>`;
                html += `<div class="h2h-odds">${h.odds}</div>`;
                html += '</div>';
            });
            html += '</div>';
            return html;
        }

        // ========== 篮球玩法渲染 ==========
        function renderBasketballSPF(m) {
            const w = m.win_odds || 1.85;
            const l = m.lose_odds || 1.95;
            let html = '<div class="odds-row" style="grid-template-columns: repeat(2, 1fr);">';
            [['胜', w, 'win'], ['负', l, 'lose']].forEach(([label, odds, cls]) => {
                const key = m.id + '_bb_spf_' + label;
                const isSel = selectedMatches.some(s => s.key === key);
                html += `<div class="odds-btn ${cls} ${isSel?'selected':''}" onclick="pickOption('${m.id}','${esc(m.home_team||'')} VS ${esc(m.away_team||'')}','${label}',${odds},'bb_spf')">`;
                html += `<span class="opt-label">${label}</span>`;
                html += `<span class="opt-odds">${odds}</span>`;
                html += '</div>';
            });
            html += '</div>';
            return html;
        }

        function renderBasketballHandicap(m) {
            const handicap = m.handicap || '-5.5';
            const w = m.handicap_win_odds || 1.90;
            const l = m.handicap_lose_odds || 1.90;
            let html = '<div class="match-header" style="padding:6px 14px;font-size:12px;background:transparent;border:none;">';
            html += `<span class="handicap-tag">让分 ${handicap}</span>`;
            html += '</div>';
            html += '<div class="odds-row" style="grid-template-columns: repeat(2, 1fr);">';
            [['让胜', w, 'win'], ['让负', l, 'lose']].forEach(([label, odds, cls]) => {
                const key = m.id + '_bb_rq_' + label;
                const isSel = selectedMatches.some(s => s.key === key);
                html += `<div class="odds-btn ${cls} ${isSel?'selected':''}" onclick="pickOption('${m.id}','${esc(m.home_team||'')} VS ${esc(m.away_team||'')}','${label}',${odds},'bb_rq')">`;
                html += `<span class="opt-label">${label}</span>`;
                html += `<span class="opt-odds">${odds}</span>`;
                html += '</div>';
            });
            html += '</div>';
            return html;
        }

        // ========== 选择逻辑 ==========
        function pickSPF(matchId, matchName, label, odds, betType) {
            const key = matchId + '_' + betType + '_' + label;
            toggleSelection(matchId, matchName, betType, label, odds, key);
        }

        function pickOption(matchId, matchName, label, odds, betType) {
            const key = matchId + '_' + betType + '_' + label.replace(/\s+/g, '');
            toggleSelection(matchId, matchName, betType, label, odds, key);
        }

        function toggleSelection(matchId, matchName, pickType, pickLabel, odds, key) {
            if (odds === '--' || isNaN(odds) || odds <= 0) { alert('该赔率暂不可用'); return; }
            const idx = selectedMatches.findIndex(s => s.key === key);
            if (idx >= 0) {
                // 点击已选中的选项，取消选择
                selectedMatches.splice(idx, 1);
            } else {
                // 竞彩规则：同一场比赛只能选1个选项（不同玩法也不能同时选）
                const sameMatch = selectedMatches.findIndex(s => s.matchId === matchId);
                if (sameMatch >= 0) {
                    // 替换该比赛的选项
                    selectedMatches.splice(sameMatch, 1);
                }
                if (selectedMatches.length >= 8) { alert('最多选择8场比赛'); return; }
                selectedMatches.push({ matchId, matchName, pickType, pickLabel, odds, isBanker: false, key });
            }
            renderMatches();
            updateBottomBar();
        }

        function toggleBanker(matchId, matchName) {
            // 竞彩规则：同一场比赛只能选1个选项，设胆就是给这个选项标记为胆码
            const matchSel = selectedMatches.find(s => s.matchId === matchId);
            if (!matchSel) { alert('请先选择该比赛的投注选项'); return; }
            matchSel.isBanker = !matchSel.isBanker;
            renderMatches();
            updateBottomBar();
        }

        // ========== 底部栏更新 ==========
        function updateBottomBar() {
            document.getElementById('selectedCount').textContent = selectedMatches.length;
            document.getElementById('selectedCountPanel').textContent = selectedMatches.length;
            
            const totalBets = calculateTotalBets();
            const amount = totalBets * 2 * multiplier;
            document.getElementById('totalAmount').textContent = amount;
            
            const maxOdds = calculateMaxOdds();
            const maxPrize = amount * maxOdds;
            document.getElementById('maxPrize').textContent = maxPrize.toFixed(2);
            
            renderSelectedPanel();
        }

        function calculateTotalBets() {
            if (selectedMatches.length === 0) return 0;
            // 简化计算：M串N的注数
            const passMap = {
                '2串1': 1, '3串1': 1, '4串1': 1, '5串1': 1, '6串1': 1, '7串1': 1, '8串1': 1,
                '3串4': 4, '4串5': 5, '4串11': 11, '5串16': 16, '5串26': 26,
                '6串20': 20, '6串35': 35, '6串42': 42, '6串57': 57
            };
            return passMap[selectedPass] || 1;
        }

        function calculateMaxOdds() {
            if (selectedMatches.length === 0) return 0;
            return selectedMatches.reduce((acc, s) => acc * s.odds, 1);
        }

        function renderSelectedPanel() {
            const container = document.getElementById('selectedListPanel');
            if (selectedMatches.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:#6b7280;">暂无选择</div>';
                return;
            }
            let html = '';
            selectedMatches.forEach((s, i) => {
                html += `<div class="sel-item">`;
                html += `<div class="sel-info">`;
                html += `<div class="sel-match">${s.matchId} ${s.matchName}${s.isBanker?'<span class="sel-banker">胆</span>':''}</div>`;
                html += `<div class="sel-pick">${s.pickLabel} @${s.odds}</div>`;
                html += `</div>`;
                html += `<button class="sel-remove" onclick="removeSelection(${i})">×</button>`;
                html += `</div>`;
            });
            container.innerHTML = html;
        }

        function removeSelection(idx) {
            selectedMatches.splice(idx, 1);
            renderMatches();
            updateBottomBar();
        }

        // ========== 面板控制 ==========
        function toggleSelectedPanel() {
            const panel = document.getElementById('selectedPanel');
            const passPanel = document.getElementById('passPanel');
            passPanel.classList.remove('show');
            panel.classList.toggle('show');
        }

        function showPassPanel() {
            const panel = document.getElementById('passPanel');
            const selectedPanel = document.getElementById('selectedPanel');
            selectedPanel.classList.remove('show');
            panel.classList.toggle('show');
            renderPassOptions();
        }

        function closeAllPanels() {
            document.getElementById('selectedPanel').classList.remove('show');
            document.getElementById('passPanel').classList.remove('show');
        }

        function renderPassOptions() {
            const container = document.getElementById('passOptions');
            const options = ['2串1','3串1','4串1','5串1','6串1','7串1','8串1','3串4','4串5','4串11','5串16','5串26','6串20','6串35','6串42','6串57'];
            let html = '';
            options.forEach(opt => {
                html += `<button class="${opt===selectedPass?'active':''}" onclick="selectPass('${opt}')">${opt}</button>`;
            });
            container.innerHTML = html;
        }

        function selectPass(pass) {
            selectedPass = pass;
            renderPassOptions();
            updateBottomBar();
        }

        function setPassMode(mode) {
            passMode = mode;
            document.querySelectorAll('.pass-mode-switch button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function changeMultiplier(delta) {
            const input = document.getElementById('multiplier');
            multiplier = Math.max(1, Math.min(50, parseInt(input.value) + delta));
            input.value = multiplier;
            updateBottomBar();
        }

        // ========== 初始化 ==========
        document.addEventListener('DOMContentLoaded', function() {
            renderBetTabs();
            renderMatches();
            updateBottomBar();
        });
    </script>
</body>
</html>
