<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智胜AI · 奖金计算器</title>
    <meta name="description" content="从今日未开赛赛事中选择比赛，计算竞彩串关奖金。" />
    <style>
        /* ===== 复用网站样式 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            background: #0b0b14;
            color: #e5e7eb;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

        /* ===== 导航 ===== */
        .navbar {
            background: rgba(11, 11, 20, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 10px 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .navbar .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; max-width: 1200px; }
        .logo { font-size: 18px; font-weight: 800; color: #8b5cf6; text-decoration: none; }
        .logo span { color: #fff; }
        .nav-links { display: flex; gap: 2px; flex-wrap: wrap; }
        .nav-links a {
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: #9ca3af;
            text-decoration: none;
            transition: all 0.2s;
        }
        .nav-links a:hover { color: #e5e7eb; background: rgba(255, 255, 255, 0.04); }
        .nav-links a.active { color: #a78bfa; background: rgba(139, 92, 246, 0.12); }

        /* ===== 卡片 ===== */
        .card {
            background: #14141f;
            border: 1px solid #2a2a3e;
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card-title .count {
            font-size: 13px;
            font-weight: 400;
            color: #6b7280;
        }
        .card-title .badge {
            font-size: 11px;
            font-weight: 500;
            color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
            padding: 2px 10px;
            border-radius: 12px;
        }

        /* ===== 比赛列表 ===== */
        .match-check {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 8px;
            margin: 0 -6px;
        }
        .match-check:hover { background: rgba(255, 255, 255, 0.03); }
        .match-check input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #8b5cf6;
            cursor: pointer;
            flex-shrink: 0;
        }
        .match-check .info {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            align-items: center;
        }
        .match-check .info .teams { font-size: 14px; font-weight: 500; }
        .match-check .info .meta { font-size: 12px; color: #6b7280; }
        .match-check .info .odds { font-size: 13px; color: #8b5cf6; font-weight: 600; }

        .empty-state {
            padding: 30px 20px;
            text-align: center;
            color: #6b7280;
        }
        .empty-state .icon { font-size: 32px; margin-bottom: 8px; }

        /* ===== 已选区域 ===== */
        .selected-area {
            background: rgba(139, 92, 246, 0.04);
            border: 1px dashed rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            padding: 12px 16px;
            margin: 8px 0 12px;
            min-height: 44px;
        }
        .selected-area .empty { color: #6b7280; font-size: 13px; }
        .selected-area .tag {
            display: inline-block;
            background: rgba(139, 92, 246, 0.12);
            color: #a78bfa;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin: 2px 4px 2px 0;
        }
        .selected-area .tag .remove {
            cursor: pointer;
            margin-left: 4px;
            color: #6b7280;
        }
        .selected-area .tag .remove:hover { color: #ef4444; }

        /* ===== 按钮 ===== */
        .btn {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #8b5cf6; color: #fff; }
        .btn-primary:hover { background: #7c3aed; }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-secondary { background: transparent; border: 1px solid #2a2a3e; color: #9ca3af; }
        .btn-secondary:hover { border-color: #8b5cf6; color: #e5e7eb; }
        .btn-sm { padding: 4px 14px; font-size: 12px; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

        /* ===== 串关方式 ===== */
        .pass-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .pass-btns button {
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid #2a2a3e;
            background: transparent;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pass-btns button:hover { border-color: #6b7280; }
        .pass-btns button.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.1); color: #a78bfa; }

        /* ===== 结果 ===== */
        .result-box {
            background: #1a1a2a;
            border-radius: 12px;
            padding: 16px 20px;
            margin-top: 12px;
            border: 1px solid #2a2a3e;
        }
        .result-box .item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 14px;
        }
        .result-box .item .val { font-weight: 600; }
        .result-box .item .val.win { color: #22c55e; }
        .result-box .item .val.highlight { color: #8b5cf6; }
        .result-box .divider { border-top: 1px solid #2a2a3e; margin: 8px 0; }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            gap: 4px;
            background: #1a1a2a;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 16px;
        }
        .tabs button {
            flex: 1;
            padding: 8px 16px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tabs button.active { background: #14141f; color: #e5e7eb; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .card { padding: 16px; }
            .match-check { flex-wrap: wrap; }
            .match-check .info { gap: 2px 8px; }
            .match-check .info .teams { font-size: 13px; }
        }

        .text-muted { color: #6b7280; }
        .text-sm { font-size: 13px; }
        .mt-2 { margin-top: 8px; }
        .mb-2 { margin-bottom: 8px; }
        .loading { text-align: center; padding: 30px; color: #6b7280; }
    </style>
</head>

    <!-- ===== Tabs ===== -->

<script>
    // ============================================================
    // Supabase 配置
    // ============================================================
    const SUPABASE_URL = 'https://br-hip-deer-b1d17b48.supabase2.aidap-global.cn-beijing.volces.com';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjMzNjI0MDA4NjgsInJvbGUiOiJhbm9uIn0.I2p7Z5mHZ0xHa0zQ8sashnT6QYhW2_ilgdPxAuPXwtM';

    const today = new Date().toISOString().slice(0, 10);

    // ============================================================
    // 工具
    // ============================================================
    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function fmtTime(dt) { if (!dt) return ''; try { return dt.slice(11, 16); } catch (e) { return ''; } }

    async function querySupabase(table, select, filters) {
        let url = `${SUPABASE_URL}/rest/v1/${table}?select=${select}`;
        if (filters) {
            Object.entries(filters).forEach(([key, val]) => {
                url += `&${key}=eq.${encodeURIComponent(val)}`;
            });
        }
        const resp = await fetch(url, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        return resp.json();
    }

    // ============================================================
    // 获取数据（只获取未开赛的比赛）
    // ============================================================
    async function fetchMatches(sport) {
        const data = await querySupabase(
            'matches',
            'id,teams,match_time,handicap,status,win_odds,draw_odds,lose_odds,home_score,away_score,metadata',
            { sport_type: sport, status: '未开赛' }  // ← 关键：只取未开赛
        );
        return data.filter(m => {
            if (!m.match_time) return false;
            return m.match_time.slice(0, 10) === today;
        }).sort((a, b) => (a.match_time || '').localeCompare(b.match_time || ''));
    }

    // ============================================================
    // 获取AI预测（用于推荐选项）
    // ============================================================
    async function fetchPredictions(matchIds) {
        if (!matchIds || matchIds.length === 0) return [];
        const data = await querySupabase(
            'predictions',
            'match_id,ai_name,spf',
            { sport_type: 'football' }
        );
        return data.filter(p => matchIds.includes(p.match_id));
    }

    // ============================================================
    // 渲染比赛列表
    // ============================================================
    function renderMatches(containerId, matches, sport, predictions) {
        const container = document.getElementById(containerId);
        if (!container) return;

        if (!matches || matches.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <div>今日暂无未开赛的${sport === 'football' ? '足球' : '篮球'}赛事</div>
                    <div style="font-size:12px;color:#6b7280;margin-top:4px;">比赛开售后会显示在这里</div>
                </div>
            `;
            return;
        }

        const predMap = {};
        if (predictions) {
            predictions.forEach(p => {
                if (!predMap[p.match_id]) predMap[p.match_id] = [];
                predMap[p.match_id].push(p);
            });
        }

        let html = '';
        matches.forEach(m => {
            const odds = m.win_odds || m.draw_odds || m.lose_odds || 1.80;
            const preds = predMap[m.id] || [];
            const topVote = getTopVote(preds);

            html += `
                <label class="match-check" data-id="${m.id}" data-odds="${odds}">
                    <input type="checkbox" class="match-cb" data-id="${m.id}" data-odds="${odds}" />
                    <div class="info">
                        <span class="teams">${esc(m.teams)}</span>
                        <span class="meta">${fmtTime(m.match_time)} · 让球 ${m.handicap || '—'}</span>
                        ${topVote ? `<span class="meta" style="color:#8b5cf6;">AI共识 ${topVote}</span>` : ''}
                        <span class="odds">赔率 ${odds}</span>
                    </div>
                </label>
            `;
        });

        container.innerHTML = html;

        container.querySelectorAll('.match-cb').forEach(cb => {
            cb.addEventListener('change', function() {
                updateSelected(sport);
            });
        });

        const countEl = document.getElementById(sport === 'football' ? 'fbCount' : 'bbCount');
        if (countEl) countEl.textContent = `共 ${matches.length} 场`;

        // 默认选中前3场
        const cbs = container.querySelectorAll('.match-cb');
        const maxDefault = Math.min(cbs.length, 3);
        for (let i = 0; i < maxDefault; i++) {
            cbs[i].checked = true;
        }
        updateSelected(sport);
    }

    function getTopVote(preds) {
        if (!preds || preds.length === 0) return null;
        const votes = { '胜': 0, '平': 0, '负': 0 };
        preds.forEach(p => {
            const spf = p.spf || '';
            if (spf.includes('胜')) votes['胜'] += 1;
            else if (spf.includes('负')) votes['负'] += 1;
            else if (spf.includes('平')) votes['平'] += 1;
        });
        const sorted = Object.entries(votes).sort((a, b) => b[1] - a[1]);
        if (sorted[0][1] === 0) return null;
        return sorted[0][0] + ' ' + sorted[0][1] + '/' + preds.length;
    }

    // ============================================================
    // 更新已选区域
    // ============================================================
    function updateSelected(sport) {
        const container = document.getElementById(sport === 'football' ? 'fbMatchList' : 'bbMatchList');
        const selectedEl = document.getElementById(sport === 'football' ? 'fbSelected' : 'bbSelected');
        if (!container || !selectedEl) return;

        const cbs = container.querySelectorAll('.match-cb:checked');
        const odds = [];
        const names = [];

        cbs.forEach(cb => {
            const row = cb.closest('.match-check');
            const name = row.querySelector('.teams')?.textContent || '比赛';
            names.push(name);
            odds.push(parseFloat(cb.dataset.odds) || 1.80);
        });

        if (cbs.length === 0) {
            selectedEl.innerHTML = '<span class="empty">👆 请从上方勾选比赛</span>';
            return;
        }

        let tags = '';
        names.forEach((name, i) => {
            tags += `<span class="tag">${esc(name)} <span class="remove" data-idx="${i}">✕</span></span>`;
        });

        selectedEl.innerHTML = `
            <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;">
                <span style="font-size:13px;color:#6b7280;margin-right:4px;">已选 ${cbs.length} 场：</span>
                ${tags}
            </div>
        `;

        selectedEl.querySelectorAll('.remove').forEach(el => {
            el.addEventListener('click', function(e) {
                e.stopPropagation();
                const idx = parseInt(this.dataset.idx);
                const allCbs = container.querySelectorAll('.match-cb');
                if (allCbs[idx]) allCbs[idx].checked = false;
                updateSelected(sport);
            });
        });

        selectedEl.dataset.odds = JSON.stringify(odds);
        selectedEl.dataset.count = cbs.length;
    }

    // ============================================================
    // 计算奖金
    // ============================================================
    function calcBonus(sport) {
        const selectedEl = document.getElementById(sport === 'football' ? 'fbSelected' : 'bbSelected');
        const resultEl = document.getElementById(sport === 'football' ? 'fbResult' : 'bbResult');
        const passBtns = document.getElementById(sport === 'football' ? 'fbPassBtns' : 'bbPassBtns');

        if (!selectedEl || !resultEl || !passBtns) return;

        const odds = JSON.parse(selectedEl.dataset.odds || '[]');
        const count = parseInt(selectedEl.dataset.count || '0');

        if (count < 2) {
            alert('至少选择2场比赛（当前已选 ' + count + ' 场）');
            return;
        }

        const activeBtn = passBtns.querySelector('button.active');
        const passType = activeBtn ? activeBtn.dataset.pass : '3串1';

        const combined = odds.reduce((a, b) => a * b, 1);
        const prize = 2 * combined;

        const prefix = sport === 'football' ? 'fb' : 'bb';
        document.getElementById(prefix + 'PassType').textContent = passType;
        document.getElementById(prefix + 'MatchCount').textContent = count + ' 场';
        document.getElementById(prefix + 'Invest').textContent = '2 元';
        document.getElementById(prefix + 'MaxPrize').textContent = prize.toFixed(2) + ' 元';
        document.getElementById(prefix + 'CombinedOdds').textContent = combined.toFixed(2);

        resultEl.style.display = 'block';
    }

    // ============================================================
    // 串关方式切换
    // ============================================================
    document.querySelectorAll('.pass-btns').forEach(group => {
        group.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });
    });

    // ============================================================
    // 按钮事件
    // ============================================================
    document.getElementById('calcFb').addEventListener('click', () => calcBonus('football'));
    document.getElementById('calcBb').addEventListener('click', () => calcBonus('basketball'));

    document.getElementById('clearFb').addEventListener('click', () => {
        document.querySelectorAll('#fbMatchList .match-cb').forEach(cb => cb.checked = false);
        updateSelected('football');
        document.getElementById('fbResult').style.display = 'none';
    });
    document.getElementById('clearBb').addEventListener('click', () => {
        document.querySelectorAll('#bbMatchList .match-cb').forEach(cb => cb.checked = false);
        updateSelected('basketball');
        document.getElementById('bbResult').style.display = 'none';
    });

    // ============================================================
    // Tabs 切换
    // ============================================================
    document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + this.dataset.tab).classList.add('active');
        });
    });

    // ============================================================
    // 初始化
    // ============================================================
    async function init() {
        console.log('🚀 加载计算器数据...');

        try {
            const fbMatches = await fetchMatches('football');
            const fbIds = fbMatches.map(m => m.id);
            const fbPreds = fbIds.length > 0 ? await fetchPredictions(fbIds) : [];
            renderMatches('fbMatchList', fbMatches, 'football', fbPreds);
        } catch (e) {
            document.getElementById('fbMatchList').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div>加载失败，请刷新</div>';
            console.error(e);
        }

        try {
            const bbMatches = await fetchMatches('basketball');
            renderMatches('bbMatchList', bbMatches, 'basketball', []);
        } catch (e) {
            document.getElementById('bbMatchList').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div>加载失败，请刷新</div>';
            console.error(e);
        }

        console.log('✅ 计算器加载完成');
    }

    document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
