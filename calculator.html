/**
 * 从数组 arr 中取出 k 个元素的所有组合（递归回溯）
 */
function getCombinations(arr, k) {
    if (k === 0) return [[]];
    if (arr.length === 0 || k > arr.length) return [];
    const result = [];
    const [first, ...rest] = arr;
    // 包含第一个
    for (const combo of getCombinations(rest, k - 1)) {
        result.push([first, ...combo]);
    }
    // 不包含第一个
    for (const combo of getCombinations(rest, k)) {
        result.push(combo);
    }
    return result;
}

        '6串20': [{ m: 3 }, { m: 4 }, { m: 5 }, { m: 6 }],
        '6串35': [{ m: 2 }, { m: 3 }, { m: 4 }, { m: 5 }, { m: 6 }],
        '6串42': [{ m: 3 }, { m: 4 }, { m: 5 }, { m: 6 }],
        '6串57': [{ m: 2 }, { m: 3 }, { m: 4 }, { m: 5 }, { m: 6 }],
    };
    return rules[passType] || [{ m: parseInt(passType.match(/\d+/)?.[0] || 0) }];
}

/**
 * 计算 M串N 总注数（核心）
 */
function calculateMxNCombinations(matchIds, matchCounts, passType) {
    const passParts = passType.match(/(\d+)串(\d+)/);
    if (!passParts) return 0;
    const m = parseInt(passParts[1]);
    const totalMatches = matchIds.length;
    if (totalMatches < m) return 0;

    const isStandard = passType.endsWith('串1');
    const allCombos = getCombinations(matchIds, m);

    if (isStandard) {
        let total = 0;
        for (const combo of allCombos) {
            let bet = 1;
            for (const id of combo) {
                const idx = matchIds.indexOf(id);
                bet *= matchCounts[idx];
            }
            total += bet;
        }
        return total;
    }

    // 复合串关
    const subs = getSubCombinationsForMxN(passType);
    let total = 0;
    for (const sub of subs) {
        const subCombos = getCombinations(matchIds, sub.m);
        for (const combo of subCombos) {
            let bet = 1;
            for (const id of combo) {
                const idx = matchIds.indexOf(id);
                bet *= matchCounts[idx];
            }
            total += bet;
        }
    }
    return total;
}

// ================================================================
//  3. 应用状态
// ================================================================

const state = {
    matches: window.MATCH_DATA || [],
    selected: [],
    passType: '2串1',
};

// ================================================================
//  4. DOM 引用
// ================================================================

const $ = id => document.getElementById(id);
const matchList = $('matchList');
const matchCount = $('matchCount');
const passGrid = $('passGrid');
const selectedList = $('selectedList');
const selectedCount = $('selectedCount');
const clearBtn = $('clearBtn');
const calcBtn = $('calcBtn');
const resultPanel = $('resultPanel');
const resultBonus = $('resultBonus');
const resultDetail = $('resultDetail');

// ================================================================
//  5. 渲染函数
// ================================================================

function renderMatches() {
    if (!state.matches.length) {
        matchList.innerHTML = '<div class="empty-state">暂无比赛数据</div>';
        matchCount.textContent = '0 场';
        return;
    }
    matchCount.textContent = state.matches.length + ' 场';
    let html = '';
    state.matches.forEach(m => {
        const isSelected = (type) => state.selected.some(s => s.matchId === m.id && s.type === type);
        html += `
            <div class="match-card">
                <div class="match-header">
                    <span class="match-teams">${m.home_team} <span class="vs">VS</span> ${m.away_team}</span>
                    <span class="match-time">${m.match_time || ''}</span>
                </div>
                <div class="odds-row">
                    <button class="odds-btn ${isSelected('win') ? 'selected' : ''}" data-matchid="${m.id}" data-type="win" data-odds="${m.win_odds}">
                        <span class="label">胜</span> <span class="value">${m.win_odds || '-'}</span>
                    </button>
                    <button class="odds-btn ${isSelected('draw') ? 'selected' : ''}" data-matchid="${m.id}" data-type="draw" data-odds="${m.draw_odds}">
                        <span class="label">平</span> <span class="value">${m.draw_odds || '-'}</span>
                    </button>
                    <button class="odds-btn ${isSelected('lose') ? 'selected' : ''}" data-matchid="${m.id}" data-type="lose" data-odds="${m.lose_odds}">
                        <span class="label">负</span> <span class="value">${m.lose_odds || '-'}</span>
                    </button>
                    ${m.handicap ? `<span style="font-size:13px;color:#94a3b8;margin-left:4px;">让球 ${m.handicap}</span>` : ''}
                </div>
            </div>
        `;
    });
    matchList.innerHTML = html;

    matchList.querySelectorAll('.odds-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const matchId = btn.dataset.matchid;
            const type = btn.dataset.type;
            const odds = parseFloat(btn.dataset.odds);
            if (isNaN(odds) || odds <= 0) return;
            toggleSelection(matchId, type, odds);
        });
    });
}

function renderPassTypes() {
    const types = ['2串1', '3串1', '4串1', '5串1', '6串1', '7串1', '8串1',
                   '3串4', '4串5', '4串11', '5串16', '5串26',
                   '6串20', '6串35', '6串42', '6串57'];
    let html = '';
    types.forEach(t => {
        const active = t === state.passType ? 'active' : '';
        html += `<button class="pass-btn ${active}" data-pass="${t}">${t}</button>`;
    });
    passGrid.innerHTML = html;
    passGrid.querySelectorAll('.pass-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            state.passType = btn.dataset.pass;
            renderPassTypes();
            updateResult();
        });
    });
}

function renderSelected() {
    if (!state.selected.length) {
        selectedList.innerHTML = '<div class="empty-state">点击左侧比赛赔率添加</div>';
        selectedCount.textContent = '0 场';
        return;
    }
    const grouped = {};
    state.selected.forEach(s => {
        if (!grouped[s.matchId]) grouped[s.matchId] = [];
        grouped[s.matchId].push(s);
    });
    const matchMap = {};
    state.matches.forEach(m => { matchMap[m.id] = m; });

    let html = '';
    Object.keys(grouped).forEach(mid => {
        const match = matchMap[mid];
        const label = match ? `${match.home_team} VS ${match.away_team}` : mid;
        const items = grouped[mid].map(s => `${s.label}(${s.odds})`).join('、');
        html += `
            <div class="selected-item">
                <span><strong>${label}</strong> ${items}</span>
                <button class="remove" data-matchid="${mid}">✕</button>
            </div>
        `;
    });
    selectedList.innerHTML = html;
    selectedCount.textContent = state.selected.length + ' 场';

    selectedList.querySelectorAll('.remove').forEach(btn => {
        btn.addEventListener('click', () => {
            const mid = btn.dataset.matchid;
            state.selected = state.selected.filter(s => s.matchId !== mid);
            renderSelected();
            renderMatches();
            updateResult();
        });
    });
}

// ================================================================
//  6. 核心操作函数
// ================================================================

function toggleSelection(matchId, type, odds) {
    const idx = state.selected.findIndex(s => s.matchId === matchId && s.type === type);
    if (idx >= 0) {
        state.selected.splice(idx, 1);
    } else {
        const labelMap = { win: '胜', draw: '平', lose: '负' };
        state.selected.push({ matchId, type, odds, label: labelMap[type] || type });
    }
    renderMatches();
    renderSelected();
    updateResult();
}

function clearAll() {
    state.selected = [];
    renderMatches();
    renderSelected();
    updateResult();
}

// ================================================================
//  7. 计算奖金（使用新组合算法）
// ================================================================

function calculateTotalBets() {
    if (state.selected.length === 0) return 0;

    const groups = {};
    state.selected.forEach(s => {
        if (!groups[s.matchId]) groups[s.matchId] = [];
        groups[s.matchId].push(s);
    });

    const matchIds = Object.keys(groups);
    const matchCounts = matchIds.map(id => groups[id].length);

    return calculateMxNCombinations(matchIds, matchCounts, state.passType);
}

function calculateBonus() {
    if (state.selected.length === 0) return { total: 0, bets: 0 };

    const groups = {};
    state.selected.forEach(s => {
        if (!groups[s.matchId]) groups[s.matchId] = [];
        groups[s.matchId].push(s);
    });

    const matchIds = Object.keys(groups);
    const passParts = state.passType.match(/(\d+)串(\d+)/);
    if (!passParts) return { total: 0, bets: 0 };
    const m = parseInt(passParts[1]);

    if (matchIds.length < m) return { total: 0, bets: 0 };

    const isStandard = state.passType.endsWith('串1');
    const allCombos = getCombinations(matchIds, m);

    let totalOdds = 0;
    let totalBets = 0;

    if (isStandard) {
        for (const combo of allCombos) {
            let comboOdds = 1;
            let comboBets = 1;
            for (const id of combo) {
                const matchOdds = groups[id].map(s => s.odds);
                comboOdds *= matchOdds.reduce((a, b) => a * b, 1);
                comboBets *= groups[id].length;
            }
            totalOdds += comboOdds;
            totalBets += comboBets;
        }
    } else {
        const subs = getSubCombinationsForMxN(state.passType);
        for (const sub of subs) {
            const subCombos = getCombinations(matchIds, sub.m);
            for (const combo of subCombos) {
                let comboOdds = 1;
                let comboBets = 1;
                for (const id of combo) {
                    const matchOdds = groups[id].map(s => s.odds);
                    comboOdds *= matchOdds.reduce((a, b) => a * b, 1);
                    comboBets *= groups[id].length;
                }
                totalOdds += comboOdds;
                totalBets += comboBets;
            }
        }
    }

    return { total: totalOdds, bets: totalBets };
}

function updateResult() {
    const bets = calculateTotalBets();
    if (bets === 0) {
        resultPanel.style.display = 'none';
        return;
    }

    const { total, bets: totalBets } = calculateBonus();
    const stake = 2;
    const bonus = total * stake;

    resultPanel.style.display = 'block';
    resultDetail.textContent = `投注 ${stake} 元 × ${totalBets} 注 = ${stake * totalBets} 元`;
    resultBonus.innerHTML = `${bonus.toFixed(2)} <span class="unit">元</span>`;
}

// ================================================================
//  8. 初始化
// ================================================================

clearBtn.addEventListener('click', clearAll);
calcBtn.addEventListener('click', updateResult);

renderMatches();
renderPassTypes();
renderSelected();
</script>
</body>
</html>
