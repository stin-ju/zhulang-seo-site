<script>
// ============================================================
// CONFIG
// ============================================================
const SUPABASE_URL = 'https://br-hip-deer-b1d17b48.supabase2.aidap-global.cn-beijing.volces.com';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjMzNjI0MDA4NjgsInJvbGUiOiJhbm9uIn0.I2p7Z5mHZ0xHa0zQ8sashnT6QYhW2_ilgdPxAuPXwtM';

const AI_LIST = ['混元','豆包','DeepSeek','Kimi','MiniMax','扣子（皮皮）','千问','天工','文心','智谱清言'];
const AI_RETIRED = new Set(['Kimi','千问','天工']);
const AI_SHORT = {'混元':'混元','豆包':'豆包','DeepSeek':'DeepSeek','Kimi':'Kimi','MiniMax':'MiniMax','扣子（皮皮）':'扣子','千问':'千问','天工':'天工','文心':'文心','智谱清言':'智谱'};

const DIMS = [
  { key: 'spf', label: '胜平负', hitCol: null },
  { key: 'handicap', label: '让球', hitCol: 'hit_handicap' },
  { key: 'score', label: '比分', hitCol: 'hit_score' },
  { key: 'goals', label: '总进球', hitCol: 'hit_goals' },
  { key: 'half_full', label: '半全场', hitCol: 'hit_half' },
];

// ============================================================
// DATA LAYER
// ============================================================
let matchesData = [];
let predictionsData = [];
let dataLoaded = false;

async function fetchData() {
  if (dataLoaded) return;
  try {
    const [mRes, pRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/matches?select=*&order=match_time.desc`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      }).then(r => r.json()),
      fetch(`${SUPABASE_URL}/rest/v1/predictions?select=*`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      }).then(r => r.json()),
    ]);
    matchesData = Array.isArray(mRes) ? mRes : [];
    predictionsData = Array.isArray(pRes) ? pRes : [];
    dataLoaded = true;
  } catch (e) {
    console.error('Failed to fetch data:', e);
  }
}

// ============================================================
// CALCULATIONS
// ============================================================
function getSpfOdds(match, prediction) {
  const spf = (prediction.spf || '').trim();
  if (spf.includes('胜') && !spf.includes('负')) return match.win_odds || 0;
  if (spf.includes('负') && !spf.includes('胜')) return match.lose_odds || 0;
  if (spf.includes('平')) return match.draw_odds || 0;
  return 0;
}

function getHandicapOdds(match, prediction) {
  const hspf = (prediction.handicap_spf || '').trim();
  if (hspf.includes('胜') && !hspf.includes('负')) return match.handicap_win_odds || 0;
  if (hspf.includes('负') && !hspf.includes('胜')) return match.handicap_lose_odds || 0;
  if (hspf.includes('平')) return match.handicap_draw_odds || 0;
  return 0;
}

function getDimOdds(match, prediction, dimKey) {
  if (dimKey === 'spf') return getSpfOdds(match, prediction);
  if (dimKey === 'handicap') return getHandicapOdds(match, prediction);
  return getSpfOdds(match, prediction);
}

function isDimHit(prediction, dimKey) {
  if (dimKey === 'spf') return null;
  const col = DIMS.find(d => d.key === dimKey)?.hitCol;
  if (!col) return null;
  return prediction[col] === true;
}

function actualSpfFromScore(home, away) {
  if (home == null || away == null) return null;
  const h = Number(home), a = Number(away);
  if (h > a) return '胜';
  if (h < a) return '负';
  if (h === a) return '平';
  return null;
}

function isSpfHit(prediction, match) {
  const actual = actualSpfFromScore(match.home_score, match.away_score);
  if (!actual) return null;
  const pred = (prediction.spf || '').trim();
  if (pred.includes('胜') && !pred.includes('负')) return actual === '胜';
  if (pred.includes('负') && !pred.includes('胜')) return actual === '负';
  if (pred.includes('平')) return actual === '平';
  return null;
}

function isDimHitWithSpf(prediction, match, dimKey) {
  if (dimKey === 'spf') return isSpfHit(prediction, match);
  return isDimHit(prediction, dimKey);
}

function buildPredMap() {
  const map = {};
  for (const p of predictionsData) {
    if (!map[p.match_id]) map[p.match_id] = [];
    map[p.match_id].push(p);
  }
  return map;
}

function calcAiStats() {
  const predMap = buildPredMap();
  const stats = {};
  for (const ai of AI_LIST) {
    stats[ai] = {
      ai, retired: AI_RETIRED.has(ai),
      totalMatches: 0, confirmedMatches: 0,
      dimHits: { spf: 0, handicap: 0, score: 0, goals: 0, half_full: 0 },
      dimTotal: { spf: 0, handicap: 0, score: 0, goals: 0, half_full: 0 },
      dimPnl: { spf: 0, handicap: 0, score: 0, goals: 0, half_full: 0 },
      totalPnl: 0, totalInvest: 0, totalHits: 0, totalBets: 0,
    };
  }
  for (const match of matchesData) {
    const preds = predMap[match.id] || [];
    const isConfirmed = match.status === '已确认';
    for (const pred of preds) {
      const ai = pred.ai_name;
      if (!stats[ai]) continue;
      stats[ai].totalMatches++;
      if (isConfirmed) {
        stats[ai].confirmedMatches++;
        for (const dim of DIMS) {
          const hit = isDimHitWithSpf(pred, match, dim.key);
          if (hit === null) continue;
          stats[ai].dimTotal[dim.key]++;
          stats[ai].totalBets++;
          stats[ai].totalInvest += 1;
          if (hit) {
            stats[ai].dimHits[dim.key]++;
            stats[ai].totalHits++;
            const odds = getDimOdds(match, pred, dim.key);
            stats[ai].dimPnl[dim.key] += (odds - 1);
            stats[ai].totalPnl += (odds - 1);
          } else {
            stats[ai].dimPnl[dim.key] -= 1;
            stats[ai].totalPnl -= 1;
          }
        }
      }
    }
  }
  return stats;
}

function getAiHitRate(aiStats) {
  if (aiStats.totalBets === 0) return 0;
  return aiStats.totalHits / aiStats.totalBets;
}

function fmtPct(v) { return (v * 100).toFixed(1) + '%'; }
function fmtPnl(v) {
  if (v > 0) return '+' + v.toFixed(2);
  if (v < 0) return v.toFixed(2);
  return '0.00';
}
function pnlClass(v) {
  if (v > 0) return 'text-win';
  if (v < 0) return 'text-lose';
  return 'text-muted';
}

// ============================================================
// DAILY COMMENTARY HELPERS
// ============================================================
function getAvailableDates() {
  const dates = new Set();
  for (const m of matchesData) {
    if (m.match_time) {
      const d = m.match_time.substring(0, 10);
      dates.add(d);
    }
  }
  return [...dates].sort().reverse();
}

function getMatchesByDate(dateStr) {
  return matchesData.filter(m => m.match_time && m.match_time.substring(0, 10) === dateStr);
}

function getCommentaryForDate(dateStr) {
  const dayMatches = getMatchesByDate(dateStr);
  for (const m of dayMatches) {
    if (m.metadata && m.metadata.daily_commentary) {
      return m.metadata.daily_commentary;
    }
  }
  return null;
}

function getAiSummaryForDate(dateStr) {
  const dayMatches = getMatchesByDate(dateStr);
  for (const m of dayMatches) {
    if (m.metadata && m.metadata.ai_summary) {
      return m.metadata.ai_summary;
    }
  }
  return null;
}

// Build a simple commentary from predictions if no DB commentary exists
function buildFallbackCommentary(dateStr) {
  const dayMatches = getMatchesByDate(dateStr);
  if (dayMatches.length === 0) return null;
  
  const predMap = buildPredMap();
  let parts = [];
  
  for (const match of dayMatches) {
    const preds = predMap[match.id] || [];
    if (preds.length === 0) continue;
    
    const spfVotes = { '胜': 0, '平': 0, '负': 0 };
    for (const p of preds) {
      const spf = (p.spf || '').trim();
      if (spf.includes('胜') && !spf.includes('负')) spfVotes['胜']++;
      else if (spf.includes('负') && !spf.includes('胜')) spfVotes['负']++;
      else if (spf.includes('平')) spfVotes['平']++;
    }
    
    const total = preds.length;
    const top = Object.entries(spfVotes).sort((a, b) => b[1] - a[1])[0];
    const consensus = Math.round(top[1] / total * 100);
    
    parts.push(`<p><strong>${match.teams}</strong> — ${total}个AI中${top[1]}个看好「${top[0]}」(共识度${consensus}%)，比分预测集中在AI各自分析中。</p>`);
  }
  
  if (parts.length === 0) return null;
  return `<h3>📊 ${dateStr} AI预测概览</h3>\n${parts.join('\n')}`;
}

// ============================================================
// ROUTER
// ============================================================
const NAV_ITEMS = [
  { hash: '#/', label: '排行榜' },
  { hash: '#/matches', label: '比赛' },
  { hash: '#/ai', label: 'AI' },
  { hash: '#/betting', label: '盈亏' },
  { hash: '#/daily', label: '每日分析' },
];

function updateNav() {
  const hash = location.hash || '#/';
  const container = document.getElementById('nav-links');
  container.innerHTML = NAV_ITEMS.map(item => {
    const isActive = hash === item.hash || (item.hash !== '#/' && hash.startsWith(item.hash));
    return `<a href="${item.hash}" class="rounded-lg px-3 py-1.5 text-sm font-medium transition-colors ${
      isActive ? 'bg-accent/20 text-accent' : 'text-muted hover:text-gray-100 hover:bg-white/5'
    }">${item.label}</a>`;
  }).join('');
}

function getRoute() {
  const hash = location.hash.slice(1) || '/';
  if (hash === '/') return { page: 'leaderboard' };
  if (hash === '/matches') return { page: 'matches' };
  if (hash.startsWith('/matches/')) return { page: 'matchDetail', id: decodeURIComponent(hash.slice(9)) };
  if (hash === '/ai') return { page: 'aiList' };
  if (hash.startsWith('/ai/')) return { page: 'aiDetail', name: decodeURIComponent(hash.slice(4)) };
  if (hash === '/betting') return { page: 'betting' };
  if (hash === '/daily') return { page: 'daily' };
  if (hash.startsWith('/daily/')) return { page: 'daily', date: decodeURIComponent(hash.slice(7)) };
  return { page: 'notfound' };
}

async function navigate() {
  updateNav();
  await fetchData();
  const route = getRoute();
  const app = document.getElementById('app');
  app.classList.remove('fade-in');
  void app.offsetWidth;
  app.classList.add('fade-in');

  switch (route.page) {
    case 'leaderboard': renderLeaderboard(app); break;
    case 'matches': renderMatchList(app); break;
    case 'matchDetail': renderMatchDetail(app, route.id); break;
    case 'aiList': renderAiList(app); break;
    case 'aiDetail': renderAiDetail(app, route.name); break;
    case 'betting': renderBetting(app); break;
    case 'daily': renderDaily(app, route.date); break;
    default: app.innerHTML = '<div class="text-center py-24"><div class="text-6xl font-bold text-accent">404</div><p class="mt-4 text-muted">页面不存在</p><a href="#/" class="inline-block mt-6 px-4 py-2 rounded-md border border-accent/40 text-accent hover:bg-accent/10">返回排行榜</a></div>';
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', navigate);
window.addEventListener('DOMContentLoaded', navigate);

// ============================================================
// PAGE: DAILY ANALYSIS (评论风格)
// ============================================================
function renderDaily(el, selectedDate) {
  const dates = getAvailableDates();
  if (dates.length === 0) {
    el.innerHTML = '<div class="text-center py-24 text-muted">暂无赛事数据</div>';
    return;
  }
  
  const dateStr = selectedDate || dates[0];
  const dayMatches = getMatchesByDate(dateStr);
  const commentary = getCommentaryForDate(dateStr) || buildFallbackCommentary(dateStr);
  const predMap = buildPredMap();

  // Build consensus cards for each match
  let consensusCards = '';
  for (const match of dayMatches) {
    const preds = predMap[match.id] || [];
    if (preds.length === 0) continue;
    
    const spfVotes = { '胜': [], '平': [], '负': [] };
    for (const p of preds) {
      const spf = (p.spf || '').trim();
      const aiLabel = AI_SHORT[p.ai_name] || p.ai_name;
      if (spf.includes('胜') && !spf.includes('负')) spfVotes['胜'].push(aiLabel);
      else if (spf.includes('负') && !spf.includes('胜')) spfVotes['负'].push(aiLabel);
      else if (spf.includes('平')) spfVotes['平'].push(aiLabel);
    }
    
    const total = preds.length;
    const sorted = Object.entries(spfVotes).sort((a, b) => b[1].length - a[1].length);
    const topResult = sorted[0];
    const consensus = Math.round(topResult[1].length / total * 100);
    const isHighConsensus = consensus >= 70;
    const isSplit = sorted[0][1].length === sorted[1][1].length;
    
    consensusCards += `
    <div class="rounded-xl bg-card border ${isHighConsensus ? 'border-win/40' : isSplit ? 'border-lose/40' : 'border-border'} p-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-sm font-semibold">${match.teams}</span>
        <span class="text-[10px] px-1.5 py-0.5 rounded ${isHighConsensus ? 'bg-win/15 text-win' : isSplit ? 'bg-lose/15 text-lose' : 'bg-accent/15 text-accent'}">
          ${isHighConsensus ? '高共识' : isSplit ? '大分歧' : '有倾向'}
        </span>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center text-xs">
        <div class="rounded-lg ${topResult[0]==='胜' ? 'bg-win/15 ring-1 ring-win/30' : 'bg-elevated'} p-2">
          <div class="font-bold ${topResult[0]==='胜' ? 'text-win' : 'text-muted'}">胜 ${spfVotes['胜'].length}</div>
        </div>
        <div class="rounded-lg ${topResult[0]==='平' ? 'bg-win/15 ring-1 ring-win/30' : 'bg-elevated'} p-2">
          <div class="font-bold ${topResult[0]==='平' ? 'text-win' : 'text-muted'}">平 ${spfVotes['平'].length}</div>
        </div>
        <div class="rounded-lg ${topResult[0]==='负' ? 'bg-win/15 ring-1 ring-win/30' : 'bg-elevated'} p-2">
          <div class="font-bold ${topResult[0]==='负' ? 'text-win' : 'text-muted'}">负 ${spfVotes['负'].length}</div>
        </div>
      </div>
    </div>`;
  }

  // Format commentary HTML
  let commentaryHtml = '';
  if (commentary) {
    // Convert line breaks and basic markdown-like formatting
    commentaryHtml = commentary
      .replace(/### (.*)/g, '<h3 class="text-lg font-bold mt-6 mb-3 text-accent">$1</h3>')
      .replace(/## (.*)/g, '<h3 class="text-xl font-bold mt-8 mb-3 text-accent">$1</h3>')
      .replace(/# (.*)/g, '<h3 class="text-2xl font-bold mt-8 mb-4 text-gray-100">$1</h3>')
      .replace(/\*\*(.*?)\*\*/g, '<strong class="text-gray-100">$1</strong>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br/>');
    commentaryHtml = '<p>' + commentaryHtml + '</p>';
    // Clean up empty paragraphs
    commentaryHtml = commentaryHtml.replace(/<p>\s*<\/p>/g, '');
    commentaryHtml = commentaryHtml.replace(/<p>\s*(<h3)/g, '$1');
    commentaryHtml = commentaryHtml.replace(/(<\/h3>)\s*<\/p>/g, '$1');
  }

  // Date picker
  let dateTabs = dates.slice(0, 14).map(d => {
    const isActive = d === dateStr;
    const label = new Date(d + 'T00:00:00').toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', weekday: 'short' });
    return `<a href="#/daily/${d}" class="whitespace-nowrap rounded-lg px-3 py-1.5 text-xs font-medium transition-colors ${
      isActive ? 'bg-accent text-white' : 'bg-card border border-border text-muted hover:text-gray-100 hover:border-accent/40'
    }">${label}</a>`;
  }).join('');

  let html = `
  <div class="mb-6">
    <h1 class="text-2xl font-bold mb-1">每日AI总评</h1>
    <p class="text-sm text-muted">7个AI的预测汇总与深度点评，每日更新</p>
  </div>

  <!-- Date tabs -->
  <div class="flex gap-2 overflow-x-auto pb-3 mb-6 scrollbar-hide">
    ${dateTabs}
  </div>

  <!-- Consensus cards -->
  <div class="mb-8">
    <h2 class="text-sm tracking-[0.18em] uppercase text-muted mb-3">今日共识速览</h2>
    <div class="grid gap-3 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
      ${consensusCards || '<div class="text-muted text-sm col-span-full">今日暂无比赛数据</div>'}
    </div>
  </div>

  <!-- Commentary article -->
  ${commentaryHtml ? `
  <div class="rounded-2xl bg-card border border-border p-6 sm:p-8 mb-8">
    <div class="flex items-center gap-3 mb-6 pb-4 border-b border-border">
      <span class="flex h-10 w-10 items-center justify-center rounded-full bg-accent/20 text-accent text-lg">✍</span>
      <div>
        <div class="font-bold">AI首席评论员</div>
        <div class="text-xs text-muted">${dateStr} · 逐浪AI实验室</div>
      </div>
    </div>
    <div class="commentary-body text-gray-300 text-[15px] leading-relaxed">
      ${commentaryHtml}
    </div>
  </div>` : `
  <div class="rounded-2xl bg-card border border-border p-8 text-center text-muted mb-8">
    <div class="text-4xl mb-3">📝</div>
    <p>今日评论尚未生成</p>
    <p class="text-xs mt-1">评论将在每日预测完成后自动生成</p>
  </div>`}

  <!-- Match list for this day -->
  <h2 class="text-lg font-bold mb-4">当日比赛</h2>
  <div class="space-y-3">
  ${dayMatches.map(match => {
    const preds = predMap[match.id] || [];
    const isConfirmed = match.status === '已确认';
    const score = isConfirmed && match.home_score != null ? `${match.home_score} - ${match.away_score}` : 'vs';
    const timeStr = match.match_time ? new Date(match.match_time).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
    return `
    <a href="#/matches/${encodeURIComponent(match.id)}" class="block rounded-xl bg-card border ${isConfirmed ? 'border-accent/30' : 'border-border'} p-4 hover:border-accent/50 transition-colors group">
      <div class="flex items-center justify-between gap-4">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="text-xs text-muted">${timeStr}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded ${isConfirmed ? 'bg-win/15 text-win' : 'bg-accent/15 text-accent'}">${isConfirmed ? '已确认' : '待比赛'}</span>
          </div>
          <div class="text-base font-semibold truncate group-hover:text-accent transition-colors">${match.teams}</div>
        </div>

          <div class="text-xs text-muted">${match.match_time ? new Date(match.match_time).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }) : ''}</div>
        </div>
        <div class="text-right">
          <div class="font-mono text-sm font-bold">${score}</div>
          ${isConfirmed ? `<div class="font-mono text-xs ${hits > 0 ? 'text-win' : 'text-lose'}">${hits}/${total}</div>` : '<div class="text-xs text-muted">待确认</div>'}
        </div>
      </div>
    </a>`;
  }

  html += `</div>`;
  el.innerHTML = html;
}

// ============================================================
// PAGE: BETTING
// ============================================================
function renderBetting(el) {
  const stats = calcAiStats();
  const active = AI_LIST.filter(a => !AI_RETIRED.has(a)).map(a => stats[a]).filter(Boolean);
  active.sort((a, b) => b.totalPnl - a.totalPnl);
  active.forEach((s, i) => s.rank = i + 1);

  const totalPnl = active.reduce((s, a) => s + a.totalPnl, 0);
  const totalInvest = active.reduce((s, a) => s + a.totalInvest, 0);
  const totalHits = active.reduce((s, a) => s + a.totalHits, 0);
  const totalBets = active.reduce((s, a) => s + a.totalBets, 0);

  let html = `
  <h1 class="text-2xl font-bold mb-2">模拟盈亏排行榜</h1>
  <p class="text-sm text-muted mb-6">每维度每场投入 1 单位，命中收益 = 赔率 - 1，未中亏损 = -1</p>

  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
    <div class="rounded-xl bg-card border border-border px-4 py-4"><div class="text-[11px] tracking-widest uppercase text-muted">总盈亏</div><div class="mt-2 font-mono text-2xl font-bold tabular ${pnlClass(totalPnl)}">${fmtPnl(totalPnl)}</div></div>
    <div class="rounded-xl bg-card border border-border px-4 py-4"><div class="text-[11px] tracking-widest uppercase text-muted">总投入</div><div class="mt-2 font-mono text-2xl font-bold">${totalInvest}</div></div>
    <div class="rounded-xl bg-card border border-border px-4 py-4"><div class="text-[11px] tracking-widest uppercase text-muted">总命中</div><div class="mt-2 font-mono text-2xl font-bold text-win">${totalHits}</div></div>
    <div class="rounded-xl bg-card border border-border px-4 py-4"><div class="text-[11px] tracking-widest uppercase text-muted">总注数</div><div class="mt-2 font-mono text-2xl font-bold">${totalBets}</div></div>
  </div>`;

  html += `
  <div class="overflow-x-auto">
  <table class="w-full text-sm">
    <thead><tr class="border-b border-border">
      <th class="text-left py-3 px-3 text-muted font-medium">#</th>
      <th class="text-left py-3 px-3 text-muted font-medium">AI</th>
      <th class="text-center py-3 px-2 text-muted font-medium">命中率</th>
      <th class="text-center py-3 px-2 text-muted font-medium">盈亏</th>
      <th class="text-center py-3 px-2 text-muted font-medium hidden sm:table-cell">胜平负</th>
      <th class="text-center py-3 px-2 text-muted font-medium hidden sm:table-cell">让球</th>
      <th class="text-center py-3 px-2 text-muted font-medium hidden lg:table-cell">比分</th>
      <th class="text-center py-3 px-2 text-muted font-medium hidden lg:table-cell">进球</th>
      <th class="text-center py-3 px-2 text-muted font-medium hidden lg:table-cell">半全场</th>
      <th class="text-center py-3 px-2 text-muted font-medium hidden sm:table-cell">注数</th>
    </tr></thead><tbody>`;

  for (const s of active) {
    html += `<tr class="border-b border-border/50">`;
    html += `<td class="py-3 px-3 font-mono font-bold ${s.rank <= 3 ? 'text-accent' : 'text-muted'}">${s.rank}</td>`;
    html += `<td class="py-3 px-3"><a href="#/ai/${encodeURIComponent(s.ai)}" class="hover:text-accent transition-colors font-medium">${AI_SHORT[s.ai]}</a></td>`;
    html += `<td class="text-center py-3 px-2 font-mono ${pnlClass(s.totalPnl)}">${fmtPct(getAiHitRate(s))}</td>`;
    html += `<td class="text-center py-3 px-2 font-mono font-bold tabular ${pnlClass(s.totalPnl)}">${fmtPnl(s.totalPnl)}</td>`;
    for (const dim of DIMS) {
      const pnl = s.dimPnl[dim.key];
      const hideClass = dim.key === 'score' || dim.key === 'goals' ? 'hidden lg:table-cell' : 'hidden sm:table-cell';
      html += `<td class="text-center py-3 px-2 font-mono tabular ${pnlClass(pnl)} ${hideClass}">${fmtPnl(pnl)}</td>`;
    }
    html += `<td class="text-center py-3 px-2 font-mono text-muted hidden sm:table-cell">${s.totalBets}</td>`;
    html += `</tr>`;
  }

  html += `</tbody></table></div>`;

  html += `<h2 class="text-lg font-bold mt-8 mb-4">维度盈亏明细</h2>`;
  html += `<div class="space-y-3">`;
  for (const s of active) {
    html += `
    <details class="rounded-xl bg-card border border-border group">
      <summary class="cursor-pointer p-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="font-mono font-bold ${s.rank <= 3 ? 'text-accent' : 'text-muted'}">#${s.rank}</span>
          <span class="font-medium">${AI_SHORT[s.ai]}</span>
        </div>
        <div class="flex items-center gap-4">
          <span class="font-mono font-bold tabular ${pnlClass(s.totalPnl)}">${fmtPnl(s.totalPnl)}</span>
          <span class="text-muted text-xs group-open:rotate-180 transition-transform">▼</span>
        </div>
      </summary>
      <div class="px-4 pb-4 pt-2 border-t border-border/50">
        <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
          ${DIMS.map(dim => {
            const pnl = s.dimPnl[dim.key];
            const hits = s.dimHits[dim.key];
            const total = s.dimTotal[dim.key];
            return `<div class="rounded-lg bg-elevated p-3"><div class="text-xs text-muted mb-1">${dim.label}</div><div class="font-mono text-lg font-bold tabular ${pnlClass(pnl)}">${fmtPnl(pnl)}</div><div class="text-xs text-muted">${hits}/${total} 命中</div></div>`;
          }).join('')}
        </div>
      </div>
    </details>`;
  }
  html += `</div>`;

  el.innerHTML = html;
}
</script>
</body></html>
