<script>
// ============================================================
// Supabase 配置
// ============================================================
const SB_URL = 'https://br-hip-deer-b1d17b48.supabase2.aidap-global.cn-beijing.volces.com';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjMzNjI0MDA4NjgsInJvbGUiOiJhbm9uIn0.I2p7Z5mHZ0xHa0zQ8sashnT6QYhW2_ilgdPxAuPXwtM';
const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

// ============================================================
// 工具函数
// ============================================================
function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function fmtTime(dt) {
    if (!dt) return '';
    try { return dt.slice(11, 16); } catch (e) { return ''; }
}

function fmtDate(dt) {
    if (!dt) return '';
    try { return dt.slice(0, 10); } catch (e) { return ''; }
}

function fmtDateLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
    const today = new Date().toISOString().slice(0, 10);
    const m = d.getMonth() + 1;
    const day = d.getDate();
    const wd = weekdays[d.getDay()];
    if (dateStr === today) return m + '/' + day + ' 今天';
    return m + '/' + day + ' 周' + wd;
}

// ============================================================
// Supabase 查询
// ============================================================
async function sbQuery(table, select, params) {
    let url = SB_URL + '/rest/v1/' + table + '?select=' + encodeURIComponent(select);
    if (params) {
        if (typeof params === 'string') {
            // 支持字符串参数（如 'sport_type=eq.football&order=match_time.asc'）
            url += '&' + params;
        } else {
            for (const [k, v] of Object.entries(params)) {
                url += '&' + k + '=' + encodeURIComponent(v);
            }
        }
    }
    const resp = await fetch(url, { headers: SB_HEADERS });
    if (!resp.ok) {
        const text = await resp.text().catch(function () { return ''; });
        throw new Error(table + ' HTTP ' + resp.status + ': ' + text.slice(0, 200));
    }
    return resp.json();
}

// ============================================================
// 数据获取
// ============================================================
let ALL_MATCHES = [];
let ALL_PREDICTIONS = [];
let ALL_RANK = [];
let DATES = [];
let CURRENT_DATE = '';

async function loadAll() {
    // 并行加载
    const [matches, rank] = await Promise.all([
        sbQuery('matches', 'id,teams,match_time,status,handicap,win_odds,draw_odds,lose_odds,home_score,away_score,metadata', 'sport_type=eq.football&order=match_time.asc'),
        sbQuery('ai_stats', 'ai_name,rank,total_pnl,hit_rate,matches,is_active', 'order=rank.asc')
    ]);

    ALL_MATCHES = matches || [];
    ALL_RANK = rank || [];

    // 提取所有比赛日期
    const dateSet = new Set();
    ALL_MATCHES.forEach(m => {
        const d = fmtDate(m.match_time);
        if (d) dateSet.add(d);
    });
    DATES = Array.from(dateSet).sort();

    // 默认选中今天，或最近的日期
    const today = new Date().toISOString().slice(0, 10);
    if (DATES.includes(today)) {
        CURRENT_DATE = today;
    } else {
        // 选最近的未开赛日期，或最后一个日期
        const future = DATES.filter(d => d >= today);
        CURRENT_DATE = future.length > 0 ? future[future.length - 1] : DATES[DATES.length - 1];
    }

    // 加载当前日期的预测
    await loadPredictions();

    // 更新全局统计
    document.getElementById('match-count').textContent = ALL_MATCHES.length;
    document.getElementById('done-count').textContent = ALL_MATCHES.filter(m => m.status === '已确认').length;

    // 渲染
    renderDateBar();
    renderCurrentDate();
    renderRank();
    renderBrief();
}

async function loadPredictions() {
    const matchIds = ALL_MATCHES
        .filter(m => fmtDate(m.match_time) === CURRENT_DATE)
        .map(m => m.id);

    if (matchIds.length === 0) {
        ALL_PREDICTIONS = [];
        return;
    }

    // 分批查询（Supabase in 过滤有长度限制）
    const all = [];
    const batchSize = 20;
    for (let i = 0; i < matchIds.length; i += batchSize) {
        const batch = matchIds.slice(i, i + batchSize);
        const orFilter = 'or=(' + batch.map(function (id) { return 'match_id.eq.' + id; }).join(',') + ')';
        const data = await sbQuery('predictions',
            'match_id,ai_name,spf,handicap_spf,score,goals,half_full,hit_handicap,hit_score,hit_goals,hit_half,total_hits',
            orFilter
        );
        all.push(...(data || []));
    }
    ALL_PREDICTIONS = all;
}

// ============================================================
// 投票计算
// ============================================================
function computeVotes(matchId) {
    const preds = ALL_PREDICTIONS.filter(p => p.match_id === matchId);
    const votes = { '胜': 0, '平': 0, '负': 0 };
    const details = [];

    preds.forEach(p => {
        const spf = (p.spf || '').trim();
        if (spf === '胜') votes['胜']++;
        else if (spf === '平') votes['平']++;
        else if (spf === '负') votes['负']++;
        else if (spf.includes('胜') && !spf.includes('负')) votes['胜']++;
        else if (spf.includes('负') && !spf.includes('胜')) votes['负']++;
        else if (spf.includes('平')) votes['平']++;
        details.push({ ai: p.ai_name, spf: spf, score: p.score, handicap: p.handicap_spf });
    });

    const total = Object.values(votes).reduce((a, b) => a + b, 0);
    const sorted = Object.entries(votes).sort((a, b) => b[1] - a[1]);
    const consensus = sorted.length > 0 ? sorted[0][0] : null;
    const consensusRate = total > 0 ? Math.round(sorted[0][1] / total * 100) : 0;

    return { votes, details, total, consensus, consensusRate, hasDivergence: total > 0 && consensusRate < 70 };
}

// ============================================================
// 渲染：日期选择栏
// ============================================================
function renderDateBar() {
    const bar = document.getElementById('date-bar');
    if (DATES.length <= 1) { bar.style.display = 'none'; return; }

    // 只显示最近7天
    const recent = DATES.slice(-7);
    let html = '<span class="label">日期：</span>';
    recent.forEach(d => {
        const active = d === CURRENT_DATE ? ' active' : '';
        html += '<span class="date-chip' + active + '" data-date="' + d + '">' + fmtDateLabel(d) + '</span>';
    });
    bar.innerHTML = html;

    bar.querySelectorAll('.date-chip').forEach(chip => {
        chip.addEventListener('click', async function () {
            const d = this.dataset.date;
            if (d === CURRENT_DATE) return;
            CURRENT_DATE = d;
            bar.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
            this.classList.add('active');
            await loadPredictions();
            renderCurrentDate();
        });
    });
}

// ============================================================
// 渲染：焦点卡片 + 赛程列表
// ============================================================
function renderCurrentDate() {
    const dayMatches = ALL_MATCHES.filter(m => fmtDate(m.match_time) === CURRENT_DATE);

    renderFocus(dayMatches);
    renderViews(dayMatches);
}

function renderFocus(matches) {
    const container = document.getElementById('focus-grid');
    if (!matches || matches.length === 0) {
        container.innerHTML = '<div class="focus-card" style="grid-column:1/-1;text-align:center;color:#6b7280;padding:30px;cursor:default;">该日期暂无赛事</div>';
        return;
    }

    const enriched = matches.map(m => ({ ...m, ...computeVotes(m.id) }));

    // 最高共识（至少有2票）
    const withVotes = enriched.filter(m => m.total >= 2);
    const sorted = [...withVotes].sort((a, b) => b.consensusRate - a.consensusRate);
    const most = sorted[0] || null;

    // 最大分歧（共识率最低且<70%）
    const divs = withVotes.filter(m => m.consensusRate < 70).sort((a, b) => a.consensusRate - b.consensusRate);
    const div = divs[0] || null;

    // 共识卡片
    let html = '';
    if (most) {
        const cls = most.consensus === '胜' ? 'win' : most.consensus === '负' ? 'lose' : 'draw';
        html += '<div class="focus-card clickable" data-match="' + esc(most.id) + '">';
        html += '<div class="tag consensus">🔥 最高共识 · ' + most.consensusRate + '%</div>';
        html += '<div class="teams">' + esc(most.teams) + '</div>';
        html += '<div class="meta">' + fmtTime(most.match_time) + ' · 让球 ' + (most.handicap || '—') + '</div>';
        html += '<div class="prediction ' + cls + '">' + most.consensus + '</div>';
        html += '<div class="votes"><span>✅ 胜 ' + most.votes['胜'] + '</span><span>⚪ 平 ' + most.votes['平'] + '</span><span>❌ 负 ' + most.votes['负'] + '</span></div>';
        html += '<div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;"><span style="font-size:12px;color:#6b7280;">点击查看各AI预测</span><span class="arrow">→</span></div>';
        html += '</div>';
    } else {
        html += '<div class="focus-card" style="display:flex;align-items:center;justify-content:center;color:#6b7280;min-height:120px;">暂无共识数据</div>';
    }

    // 分歧卡片
    if (div) {
        const cls = div.consensus === '胜' ? 'win' : div.consensus === '负' ? 'lose' : 'draw';
        const divRate = 100 - div.consensusRate;
        html += '<div class="focus-card clickable" data-match="' + esc(div.id) + '">';
        html += '<div class="tag divergence">⚡ 最大分歧 · ' + divRate + '%</div>';
        html += '<div class="teams">' + esc(div.teams) + '</div>';
        html += '<div class="meta">' + fmtTime(div.match_time) + ' · 让球 ' + (div.handicap || '—') + '</div>';
        html += '<div class="prediction ' + cls + '">' + div.consensus + '</div>';
        html += '<div class="votes"><span>✅ 胜 ' + div.votes['胜'] + '</span><span>⚪ 平 ' + div.votes['平'] + '</span><span>❌ 负 ' + div.votes['负'] + '</span></div>';
        html += '<div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;"><span style="font-size:12px;color:#6b7280;">点击查看各AI预测</span><span class="arrow">→</span></div>';
        html += '</div>';
    } else {
        html += '<div class="focus-card" style="display:flex;align-items:center;justify-content:center;color:#6b7280;min-height:120px;">' + (withVotes.length > 0 ? 'AI意见较统一' : '暂无分歧数据') + '</div>';
    }

    container.innerHTML = html;

    // 焦点卡片点击展开
    container.querySelectorAll('.focus-card.clickable').forEach(card => {
        card.addEventListener('click', function () {
            const mid = this.dataset.match;
            toggleDetail(mid);
        });
    });
}

function renderViews(matches) {
    const container = document.getElementById('view-list');
    const label = document.getElementById('match-count-label');

    if (!matches || matches.length === 0) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:#6b7280;font-size:14px;">该日期暂无赛事</div>';
        label.textContent = '共 0 场';
        return;
    }

    label.textContent = '共 ' + matches.length + ' 场';
    let html = '';

    matches.forEach(m => {
        const stats = computeVotes(m.id);
        const topVote = Object.entries(stats.votes).sort((a, b) => b[1] - a[1])[0];
        const voteCls = topVote ? (topVote[0] === '胜' ? 'win' : topVote[0] === '负' ? 'lose' : 'draw') : '';
        const isDone = m.status === '已确认';
        const result = isDone ? getMatchResult(m) : null;

        html += '<div class="view-item" data-match="' + esc(m.id) + '" style="cursor:pointer;">';
        html += '<span class="time">' + fmtTime(m.match_time) + '</span>';
        html += '<span class="teams">' + esc(m.teams) + '</span>';
        html += '<div class="badge-group">';
        if (topVote && topVote[1] > 0) {
            html += '<span class="badge-sm ' + voteCls + '">' + topVote[0] + ' ' + topVote[1] + '</span>';
        }
        if (stats.total > 0) {
            const badgeCls = stats.hasDivergence ? 'divergence' : 'consensus';
            const badgeText = stats.hasDivergence ? '分歧 ' + (100 - stats.consensusRate) + '%' : '共识 ' + stats.consensusRate + '%';
            html += '<span class="badge-sm ' + badgeCls + '">' + badgeText + '</span>';
        }
        if (isDone) {
            html += '<span class="badge-sm status-done">✓ ' + (result || '完赛') + '</span>';
        } else {
            html += '<span class="badge-sm status-pending">' + stats.total + 'AI</span>';
        }
        html += '<span class="arrow-sm">→</span>';
        html += '</div></div>';

        // 展开详情区域
        html += '<div class="match-detail" id="detail-' + esc(m.id) + '">';
        if (stats.details.length > 0) {
            html += '<div class="detail-grid">';
            stats.details.forEach(d => {
                const pCls = d.spf === '胜' ? 'win' : d.spf === '负' ? 'lose' : 'draw';
                html += '<div class="detail-item">';
                html += '<div class="ai">' + esc(d.ai) + '</div>';
                html += '<div class="pred ' + pCls + '">' + esc(d.spf || '—') + '</div>';
                html += '<div class="score">' + esc(d.score || '') + ' | ' + esc(d.handicap || '') + '</div>';
                html += '</div>';
            });
            html += '</div>';
        } else {
            html += '<div style="color:#6b7280;font-size:13px;text-align:center;padding:8px;">暂无AI预测数据</div>';
        }
        html += '</div>';
    });

    container.innerHTML = html;

    // 点击展开/收起
    container.querySelectorAll('.view-item').forEach(item => {
        item.addEventListener('click', function () {
            const mid = this.dataset.match;
            toggleDetail(mid);
        });
    });
}

function toggleDetail(matchId) {
    const el = document.getElementById('detail-' + matchId);
    if (!el) return;
    const isOpen = el.classList.contains('open');

    // 先关闭所有
    document.querySelectorAll('.match-detail.open').forEach(d => d.classList.remove('open'));

    // 切换
    if (!isOpen) el.classList.add('open');
}

function getMatchResult(match) {
    if (match.status !== '已确认') return null;
    const h = parseInt(match.home_score);
    const a = parseInt(match.away_score);
    if (isNaN(h) || isNaN(a)) return null;
    if (h > a) return '胜';
    if (h < a) return '负';
    return '平';
}

// ============================================================
// 渲染：AI排行
// ============================================================
function renderRank() {
    const container = document.getElementById('rank-list');
    if (!ALL_RANK || ALL_RANK.length === 0) {
        container.innerHTML = '<div style="color:#6b7280;font-size:13px;">暂无数据</div>';
        return;
    }

    let html = '';
    ALL_RANK.slice(0, 7).forEach((item, i) => {
        const pos = i + 1;
        const gold = pos <= 3 ? ' gold' : '';
        const pnl = parseFloat(item.total_pnl) || 0;
        const pnlCls = pnl > 0 ? 'win' : pnl < 0 ? 'lose' : '';
        const rate = parseFloat(item.hit_rate) || 0;
        const rateStr = Math.round(rate * 100) + '%';
        const activeTag = item.is_active ? '' : ' <span style="font-size:10px;color:#6b7280;">退赛</span>';

        html += '<div class="rank-row">';
        html += '<span class="pos' + gold + '">' + pos + '</span>';
        html += '<span class="name">' + esc(item.ai_name) + activeTag + '</span>';
        html += '<span class="pnl ' + pnlCls + '">' + (pnl > 0 ? '+' : '') + pnl.toFixed(1) + '</span>';
        html += '<span class="rate">' + rateStr + '</span>';
        html += '</div>';
    });

    container.innerHTML = html;
}

// ============================================================
// 渲染：简报
// ============================================================
function renderBrief() {
    const dateEl = document.getElementById('brief-date');
    const textEl = document.getElementById('brief-text');
    dateEl.textContent = CURRENT_DATE;

    // 尝试从 metadata.daily_commentary 提取简报
    const dayMatches = ALL_MATCHES.filter(m => fmtDate(m.match_time) === CURRENT_DATE);
    let commentary = '';

    for (const m of dayMatches) {
        if (m.metadata) {
            try {
                const meta = typeof m.metadata === 'string' ? JSON.parse(m.metadata) : m.metadata;
                if (meta.daily_commentary) {
                    commentary = meta.daily_commentary;
                    break;
                }
            } catch (e) {}
        }
    }

    if (commentary) {
        // 截取第一段作为简报
        const paragraphs = commentary.split('\n\n');
        const brief = paragraphs[0] || commentary;
        // 高亮关键信息
        const highlighted = esc(brief)
            .replace(/(\d+%)/g, '<span class="hl">$1</span>')
            .replace(/(共识|分歧|看胜|看负|看平)/g, '<span class="dv">$1</span>');
        textEl.innerHTML = highlighted;
    } else if (dayMatches.length === 0) {
        textEl.textContent = '该日期暂无赛事数据。';
    } else {
        // 自动生成简报
        const enriched = dayMatches.map(m => ({ ...m, ...computeVotes(m.id) }));
        const withVotes = enriched.filter(m => m.total > 0);
        const highConsensus = withVotes.filter(m => m.consensusRate >= 85);
        const divergent = withVotes.filter(m => m.consensusRate < 70);

        let text = CURRENT_DATE + ' 共 ' + dayMatches.length + ' 场赛事。';
        if (highConsensus.length > 0) {
            text += '其中 ' + highConsensus.length + ' 场AI高度共识（≥85%）。';
        }
        if (divergent.length > 0) {
            text += ' ' + divergent.length + ' 场出现明显分歧。';
        }
        if (withVotes.length === 0) {
            text += 'AI预测数据加载中...';
        }
        textEl.textContent = text;
    }
}

// ============================================================
// 初始化
// ============================================================
async function init() {
    try {
        await loadAll();
        console.log('✅ 首页加载完成');
    } catch (error) {
        console.error('❌ 加载失败:', error);
        document.querySelectorAll('.loading').forEach(el => {
            el.textContent = '⚠️ 加载失败，请刷新重试';
        });
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>
