<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI预测简报 - AI实验室·体彩好伙伴</title>
    <meta name="description" content="AI实验室每日简报，汇总7大AI模型对今日赛事的预测分析，包括共识度、分歧点、预测命中率等数据。">
    <meta name="keywords" content="AI预测,体彩预测,赛事分析,AI简报,预测命中率">
    <link rel="canonical" href="https://zhulang.coze.site/brief.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a0a2e;
            color: #e8eef7;
            min-height: 100vh;
            line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #2d1b4e 0%, #1a0a2e 100%);
            border-radius: 12px;
            margin-bottom: 24px;
            border: 1px solid rgba(245, 194, 66, 0.2);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #F5C242;
            margin-bottom: 8px;
        }
        .header .date {
            font-size: 14px;
            color: #94a3b8;
        }
        .brief-content {
            background: #2d1b4e;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 24px;
        }
        .brief-content h2 {
            font-size: 18px;
            font-weight: 600;
            color: #F5C242;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .brief-text {
            font-size: 15px;
            line-height: 1.8;
            color: #e8eef7;
        }
        .brief-text .hl { color: #8b5cf6; font-weight: 600; }
        .brief-text .dv { color: #fbbf24; font-weight: 600; }
        .back-link {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(245, 194, 66, 0.1);
            border: 1px solid rgba(245, 194, 66, 0.3);
            border-radius: 8px;
            color: #F5C242;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .back-link:hover {
            background: rgba(245, 194, 66, 0.2);
            transform: translateY(-1px);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        /* Hot News Section */
        .hot-news-section {
            background: #2d1b4e;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 24px;
        }
        .hot-news-section h2 {
            font-size: 18px;
            font-weight: 600;
            color: #F5C242;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .hot-news-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .hot-news-tab {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: transparent;
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hot-news-tab:hover {
            border-color: rgba(245, 194, 66, 0.3);
            color: #F5C242;
        }
        .hot-news-tab.active {
            background: rgba(245, 194, 66, 0.1);
            border-color: rgba(245, 194, 66, 0.3);
            color: #F5C242;
        }
        .hot-news-list {
            list-style: none;
        }
        .hot-news-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .hot-news-item:last-child {
            border-bottom: none;
        }
        .hot-news-rank {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hot-news-rank.top3 {
            background: rgba(245, 194, 66, 0.15);
            color: #F5C242;
        }
        .hot-news-title {
            flex: 1;
            font-size: 14px;
            color: #e8eef7;
            line-height: 1.5;
        }
        .hot-news-title a {
            color: inherit;
            text-decoration: none;
        }
        .hot-news-title a:hover {
            color: #F5C242;
        }
        .hot-news-date {
            flex-shrink: 0;
            font-size: 12px;
            color: #64748b;
        }
        .hot-news-loading {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✍️ AI预测简报</h1>
            <div class="date" id="brief-date">加载中...</div>
        </div>
        
        <div class="brief-content">
            <h2>今日赛事分析</h2>
            <div class="brief-text" id="brief-text">
                <div class="loading">正在加载简报内容...</div>
            </div>
        </div>

        <!-- Hot News Section -->
        <div class="hot-news-section">
            <h2>🔥 每日热点新闻</h2>
            <div class="hot-news-tabs">
                <button class="hot-news-tab active" data-source="weibo">微博热搜</button>
                <button class="hot-news-tab" data-source="toutiao">头条热榜</button>
            </div>
            <ul class="hot-news-list" id="hot-news-list">
                <li class="hot-news-loading">正在加载热点新闻...</li>
            </ul>
        </div>
        
        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://br-hip-deer-b1d17b48.supabase2.aidap-global.cn-beijing.volces.com';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjMzNjI0MDA4NjgsInJvbGUiOiJhbm9uIn0.I2p7Z5mHZ0xHa0zQ8sashnT6QYhW2_ilgdPxAuPXwtM';
        
        let ALL_MATCHES = [];
        let ALL_PREDICTIONS = [];

        function fmtDate(iso) {
            const d = new Date(iso);
            const m = (d.getMonth() + 1).toString().padStart(2, '0');
            const day = d.getDate().toString().padStart(2, '0');
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return `${m}/${day} ${weekdays[d.getDay()]}`;
        }

        function esc(s) {
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }

        async function loadData() {
            try {
                const [matchesRes, predictionsRes] = await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/matches?select=*`, { headers: { 'apikey': SUPABASE_KEY } }),
                    fetch(`${SUPABASE_URL}/rest/v1/predictions?select=*`, { headers: { 'apikey': SUPABASE_KEY } })
                ]);
                ALL_MATCHES = await matchesRes.json();
                ALL_PREDICTIONS = await predictionsRes.json();
                renderBrief();
            } catch (e) {
                console.error('加载数据失败:', e);
                document.getElementById('brief-text').textContent = '加载数据失败，请稍后重试。';
            }
        }

        function computeVotes(matchId) {
            const preds = ALL_PREDICTIONS.filter(p => p.match_id === matchId);
            const votes = { '胜': 0, '平': 0, '负': 0 };
            const details = [];
            
            for (const p of preds) {
                if (p.spf && votes[p.spf] !== undefined) {
                    votes[p.spf]++;
                }
                details.push({
                    ai: p.ai_name,
                    spf: p.spf || '-',
                    score: p.score || '-',
                    handicap: p.handicap_spf || '-'
                });
            }
            
            const total = preds.length;
            const consensus = Object.entries(votes).reduce((a, b) => a[1] > b[1] ? a : b, ['', 0]);
            const consensusRate = total > 0 ? Math.round((consensus[1] / total) * 100) : 0;
            
            return { votes, details, total, consensus: consensus[0], consensusRate };
        }

        function renderBrief() {
            const dateEl = document.getElementById('brief-date');
            const textEl = document.getElementById('brief-text');
            
            // 使用当前日期
            const now = new Date();
            const m = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const currentDate = `${m}/${day} ${weekdays[now.getDay()]}`;
            dateEl.textContent = currentDate;

            // 尝试从 metadata.daily_commentary 提取简报
            const dayMatches = ALL_MATCHES.filter(m => fmtDate(m.match_time) === currentDate);
            let commentary = '';

            for (const m of dayMatches) {
                if (m.metadata) {
                    try {
                        const meta = typeof m.metadata === 'string' ? JSON.parse(m.metadata) : m.metadata;
                        if (meta.daily_commentary) {
                            commentary = meta.daily_commentary;
                            break;
                        }
                    } catch (e) {}
                }
            }

            if (commentary) {
                // 显示完整简报
                const paragraphs = commentary.split('\n\n');
                let html = '';
                for (const p of paragraphs) {
                    const highlighted = esc(p)
                        .replace(/(\d+%)/g, '<span class="hl">$1</span>')
                        .replace(/(共识|分歧|看胜|看负|看平)/g, '<span class="dv">$1</span>');
                    html += `<p style="margin-bottom: 16px;">${highlighted}</p>`;
                }
                textEl.innerHTML = html;
            } else if (dayMatches.length === 0) {
                textEl.textContent = '该日期暂无赛事数据。';
            } else {
                // 自动生成简报
                const enriched = dayMatches.map(m => ({ ...m, ...computeVotes(m.id) }));
                const withVotes = enriched.filter(m => m.total > 0);
                const highConsensus = withVotes.filter(m => m.consensusRate >= 85);
                const divergent = withVotes.filter(m => m.consensusRate < 70);

                let text = currentDate + ' 共 ' + dayMatches.length + ' 场赛事。';
                if (highConsensus.length > 0) {
                    text += '其中 ' + highConsensus.length + ' 场AI高度共识（≥85%）。';
                }
                if (divergent.length > 0) {
                    text += ' ' + divergent.length + ' 场出现明显分歧。';
                }
                if (withVotes.length === 0) {
                    text += 'AI预测数据加载中...';
                }
                
                // 添加比赛详情
                text += '<br><br><strong>赛事详情：</strong><br>';
                for (const m of enriched) {
                    if (m.total > 0) {
                        text += `<br>• ${m.teams} - ${m.consensus || '无'}（${m.consensusRate}%共识）`;
                    }
                }
                
                textEl.innerHTML = text;
            }
        }

        // 加载数据
        loadData();

        // Hot News Section
        const hotNewsTabs = document.querySelectorAll('.hot-news-tab');
        const hotNewsList = document.getElementById('hot-news-list');
        let currentSource = 'weibo';

        // Tab switching
        hotNewsTabs.forEach(tab => {
            tab.addEventListener('click', function() {
                hotNewsTabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentSource = this.dataset.source;
                loadHotNews(currentSource);
            });
        });

        // Load hot news
        async function loadHotNews(source) {
            hotNewsList.innerHTML = '<li class="hot-news-loading">正在加载热点新闻...</li>';
            
            try {
                let data = [];
                const today = new Date();
                const dateStr = `${today.getMonth() + 1}/${today.getDate()}`;
                
                if (source === 'weibo') {
                    // Fetch Weibo hot search
                    const response = await fetch('https://weibo.com/ajax/side/hotSearch');
                    const json = await response.json();
                    if (json.data && json.data.realtime) {
                        data = json.data.realtime.slice(0, 20).map((item, index) => ({
                            rank: index + 1,
                            title: item.word,
                            url: `https://s.weibo.com/weibo?q=${encodeURIComponent(item.word)}`,
                            date: dateStr
                        }));
                    }
                } else if (source === 'toutiao') {
                    // Fetch Toutiao hot list
                    const response = await fetch('https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc');
                    const json = await response.json();
                    if (json.data) {
                        data = json.data.slice(0, 20).map((item, index) => ({
                            rank: index + 1,
                            title: item.Title,
                            url: item.Url,
                            date: dateStr
                        }));
                    }
                }
                
                renderHotNews(data);
            } catch (e) {
                console.error('加载热点新闻失败:', e);
                hotNewsList.innerHTML = '<li class="hot-news-loading">加载失败，请稍后刷新重试</li>';
            }
        }

        // Render hot news
        function renderHotNews(data) {
            if (data.length === 0) {
                hotNewsList.innerHTML = '<li class="hot-news-loading">暂无数据</li>';
                return;
            }
            
            hotNewsList.innerHTML = data.map(item => `
                <li class="hot-news-item">
                    <span class="hot-news-rank ${item.rank <= 3 ? 'top3' : ''}">${item.rank}</span>
                    <div class="hot-news-title">
                        <a href="${item.url}" target="_blank" rel="noopener">${item.title}</a>
                    </div>
                    <span class="hot-news-date">${item.date}</span>
                </li>
            `).join('');
        }

        // Load initial hot news
        loadHotNews('weibo');
    </script>
</body>
</html>
